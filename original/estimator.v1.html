<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structural Estimator</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --muted:#5f6b7a; --line:#dde1e7;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e7effb;
  --ok:#1d7a46; --bad:#b3261e; --warn:#8a5a00; --warn-soft:#fff4d6;
  --head:#eef1f5; --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1c2027; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2e343e;
    --accent:#5b9cf5; --accent-ink:#0d1420; --accent-soft:#1d2a3d;
    --ok:#5cc48a; --bad:#f2847c; --warn:#e6b450; --warn-soft:#2e2814; --head:#232832;
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --ink:#e6e9ee; --muted:#9aa4b2; --line:#2e343e;
  --accent:#5b9cf5; --accent-ink:#0d1420; --accent-soft:#1d2a3d;
  --ok:#5cc48a; --bad:#f2847c; --warn:#e6b450; --warn-soft:#2e2814; --head:#232832;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:650}
header .proj{color:var(--muted);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:2px;flex-wrap:wrap;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--muted);padding:10px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:16px;max-width:1200px;margin:0 auto}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
section.card h2{font-size:15px;margin:0 0 10px}
section.card h3{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f span.u{color:var(--muted);font-size:11px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{background:var(--head);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.div td{background:var(--accent-soft);font-weight:650}
tr.lvl td{font-weight:600;color:var(--muted)}
tr.sub td{font-weight:600;border-top:1px solid var(--ink)}
tr.tot td{font-weight:700;font-size:14px}
.muted{color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--head);color:var(--muted)}
.addgrp{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.secttl{grid-column:1/-1;font-size:12px;font-weight:650;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:3px;margin-top:6px}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--panel);color:var(--ink);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg-h h2{font-size:15px;margin:0}
.dlg-b{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;overflow:auto;max-height:calc(100vh - 150px)}
.dlg-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;align-self:start}
.preview h4{margin:8px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase}
.preview table{font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.kv b{font-weight:600}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
.err{color:var(--bad);font-size:12px}
@media (max-width:760px){.dlg-b{grid-template-columns:1fr}}
@media print{
  header,nav,footer,.noprint{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  section.card{border:0;padding:0}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr.div td{background:#e6e6e6!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <h1>Structural &amp; Architectural Estimator</h1>
  <div class="proj" id="projName"></div>
  <div class="row noprint">
    <button class="btn" onclick="App.newProject()">New</button>
    <button class="btn" onclick="App.openFile()">Open…</button>
    <button class="btn pri" onclick="App.saveFile()">Save project file</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<footer class="noprint">
  Autosaves in this browser. Use <b>Save project file</b> for a permanent copy.
  · <a href="#" onclick="App.tab('selftest');return false">Self-test</a>
</footer>
<dialog id="dlg"></dialog>

<!-- ===================================================================== -->
<!-- ENGINE: pure calculation functions, no DOM access                     -->
<!-- ===================================================================== -->
<script id="engine">
'use strict';
const DIAS = [10, 12, 16, 20, 25, 28, 32, 36];
const EPS = 1e-9;
const ceilE = x => Math.ceil(x - EPS);
const floorE = x => Math.floor(x + EPS);
const round = (x, n = 3) => Math.round(x * 10 ** n) / 10 ** n;
const kgpm = d => d * d / 162;              // kg per metre of deformed bar, d in mm
const fmt = (x, d = 2) => Number(x || 0).toLocaleString('en-PH', {minimumFractionDigits: d, maximumFractionDigits: d});

const DIVS = [
  ['REBAR', 'Reinforcing Steel Works'],
  ['CONC', 'Concrete Works'],
  ['FORM', 'Formworks'],
  ['MAS', 'Masonry Works'],
  ['PART', 'Partition Works'],
  ['CEIL', 'Ceiling Works'],
];
const DIV_NAME = Object.fromEntries(DIVS);

// ---- Default factors (editable per project). Values marked VERIFY are
// common PH estimating figures (Fajardo-style); check against your references.
function defaultFactors() {
  return {
    rebar: {
      lapFactor: 40,          // lap splice = 40 x bar diameter
      tieHookD: 6,            // 135 deg seismic hook extension = 6d ...
      tieHookMin: 75,         // ... but not less than 75 mm
      hook90D: 12,            // 90 deg standard hook extension = 12d
      commercial: [6, 7.5, 9, 10.5, 12],
      tieWirePerX: 0.3,       // m of #16 GI wire per bar intersection
      tieWireMPerKg: 53,      // m of #16 GI wire per kg
      allowancePct: 0,        // extra allowance on purchased rebar weight
    },
    concrete: {               // per m3, 40 kg cement bags  (VERIFY)
      AA: {cement: 12.0, sand: 0.50, gravel: 1.00},
      A:  {cement: 9.0,  sand: 0.50, gravel: 1.00},
      B:  {cement: 7.5,  sand: 0.50, gravel: 1.00},
      C:  {cement: 6.0,  sand: 0.50, gravel: 1.00},
    },
    chb: {
      perSqm: 12.5,           // 10x20x40 / 12.5x20x40 / 15x20x40 blocks per m2
      courseH: 0.2,           // m per course
      mortar: {               // laying mortar per m2 of wall: cement bags by class, sand m3 (VERIFY)
        '4': {A: 0.792, B: 0.522, C: 0.394, sand: 0.0435},
        '5': {A: 1.150, B: 0.770, C: 0.580, sand: 0.0640},
        '6': {A: 1.526, B: 1.018, C: 0.763, sand: 0.0844},
      },
    },
    plaster: {A: 18.0, B: 12.0, C: 9.0, D: 7.5, sandPerCum: 1.0},   // cement bags per m3 of mortar (VERIFY)
    boards: {
      GYP9:  {w: 1.22, l: 2.44}, GYP12: {w: 1.22, l: 2.44}, MR12: {w: 1.22, l: 2.44},
      FC45:  {w: 1.22, l: 2.44}, FC6:   {w: 1.22, l: 2.44}, FC9:  {w: 1.22, l: 2.44},
      PLY6:  {w: 1.22, l: 2.44},
    },
    ceiling: {
      ccSpacing: 1.2, stockLen: 5.0, wallAngleLen: 3.0, hangerSpacing: 1.2, hangerLen: 0.6,
      screwsPerBoard: 30, tapePerSqm: 1.2, compoundPerSqm: 0.5, rivetsPerFurring: 2,
      acousticMainLen: 3.66, acousticMainSp: 1.22, acousticTile: 0.6, acousticWallAngle: 3.05,
      pvcWidth: 0.2, pvcLength: 5.95, pvcMoldingLen: 3.0, pvcScrewsPerSqm: 12,
      woodFrameSp: 0.6, bdftPerM: 1.094, nailsKgPerSqm: 0.1,   // 2"x2" lumber = 1.094 bd.ft per m
    },
    partition: {studLen: 3.0, trackLen: 3.0, screwsPerBoard: 30, tapePerSqm: 1.2, compoundPerSqm: 0.5, anchorSp: 0.6},
    waste: {concrete: 5, chb: 5, board: 5, metal: 5},
  };
}

// ---- Materials and labor catalog (order = BOQ order)
const MATERIALS = [
  ...DIAS.map(d => ['RB' + d, d + 'mm deformed bar', 'kg', 55]),
  ['TW', 'Tie wire #16 GI', 'kg', 95],
  ['CEM', 'Portland cement (40 kg)', 'bag', 260],
  ['SAND', 'Washed sand', 'm³', 1500],
  ['GRAV', 'Gravel 3/4"', 'm³', 1700],
  ['FORM', 'Formwork materials (plywood, lumber, nails)', 'm²', 380],
  ['CHB4', 'CHB 4" (10x20x40)', 'pc', 16],
  ['CHB5', 'CHB 5" (12.5x20x40)', 'pc', 19],
  ['CHB6', 'CHB 6" (15x20x40)', 'pc', 23],
  ['GYP9', 'Gypsum board 9mm 1.22x2.44', 'pc', 480],
  ['GYP12', 'Gypsum board 12mm 1.22x2.44', 'pc', 540],
  ['MR12', 'Moisture-resistant gypsum 12mm 1.22x2.44', 'pc', 780],
  ['FC45', 'Fiber cement board 4.5mm 1.22x2.44', 'pc', 420],
  ['FC6', 'Fiber cement board 6mm 1.22x2.44', 'pc', 540],
  ['FC9', 'Fiber cement board 9mm 1.22x2.44', 'pc', 880],
  ['PLY6', 'Marine plywood 1/4" 1.22x2.44', 'pc', 650],
  ['STUD', 'Metal stud 3.0m', 'pc', 190],
  ['TRK', 'Metal track 3.0m', 'pc', 150],
  ['ANC', 'Concrete anchor / nail', 'pc', 5],
  ['INS', 'Insulation (glasswool)', 'm²', 180],
  ['CC', 'Carrying channel 5.0m', 'pc', 210],
  ['MF', 'Metal furring 5.0m', 'pc', 170],
  ['WA', 'Wall angle 3.0m', 'pc', 85],
  ['HANG', 'Hanger wire / rod', 'm', 20],
  ['WCL', 'W-clip / connector', 'pc', 6],
  ['MR', 'Main runner 3.66m', 'pc', 210],
  ['CT4', 'Cross tee 1.22m', 'pc', 75],
  ['CT2', 'Cross tee 0.61m', 'pc', 40],
  ['ACT', 'Acoustic tile 600x600', 'pc', 90],
  ['AWA', 'Acoustic wall angle 3.05m', 'pc', 80],
  ['PVC', 'PVC ceiling panel', 'pc', 320],
  ['PVCM', 'PVC molding 3.0m', 'pc', 120],
  ['LUM', 'Lumber 2"x2" (good lumber)', 'bd.ft', 55],
  ['NAIL', 'Common wire nails', 'kg', 90],
  ['CSCR', 'Board screws', 'pc', 0.6],
  ['RIV', 'Blind rivets', 'pc', 1.2],
  ['JT', 'Joint tape', 'm', 3],
  ['JC', 'Joint compound', 'kg', 70],
  ['CUB', 'Toilet cubicle set', 'set', 25000],
];
const LABOR = [
  ['L_RB', 'REBAR', 'Labor – rebar cutting, bending & installation', 'kg', 'unit', 12],
  ['L_CONC', 'CONC', 'Labor – concrete mixing & placing', 'm³', 'unit', 1800],
  ['L_FORM', 'FORM', 'Labor – formwork fabrication & installation', 'm²', 'unit', 280],
  ['L_CHB', 'MAS', 'Labor – CHB laying (incl. reinforcement)', 'm²', 'unit', 280],
  ['L_PLAS', 'MAS', 'Labor – plastering', 'm²', 'unit', 180],
  ['L_PART', 'PART', 'Labor – partition installation', 'm²', 'unit', 320],
  ['L_CUB', 'PART', 'Labor – cubicle installation', 'set', 'unit', 3500],
  ['L_CEIL', 'CEIL', 'Labor – ceiling installation', 'm²', 'unit', 380],
];
const CEIL_UNITS = new Set(['pc', 'bag', 'set']);   // quantities bought in whole units

// ---- Basic rebar helpers (lengths in m, diameters in mm)
const tieHook = (d, F) => Math.max(F.rebar.tieHookD * d, F.rebar.tieHookMin) / 1000;
const hook90 = (d, F) => F.rebar.hook90D * d / 1000;
const lapLen = (d, F) => F.rebar.lapFactor * d / 1000;
const countAcross = (width, sp) => (width > 0 && sp > 0) ? floorE(width / sp) + 1 : 0;   // bars spread across a width
function countZoned(H, s, Lo, sLo) {         // ties/stirrups with optional closer spacing over Lo at each end
  if (!(H > 0 && s > 0)) return 0;
  if (Lo > 0 && sLo > 0 && 2 * Lo < H) return 2 * ceilE(Lo / sLo) + ceilE((H - 2 * Lo) / s) + 1;
  return ceilE(H / s) + 1;
}

// Split a bar longer than the stock length into lapped pieces
function splitPiece(len, stock, lap) {
  const out = [];
  if (stock <= lap) return null;
  while (len > stock + EPS) { out.push(stock); len = len - stock + lap; }
  out.push(len);
  return out;
}
// First-fit decreasing, grouping identical lengths. pieces: Map len -> count
function ffdBars(pieces, stock) {
  const lens = [...pieces.keys()].sort((a, b) => b - a);
  const bins = [];   // remaining length in each purchased bar
  for (const len of lens) {
    let c = pieces.get(len);
    for (let i = 0; i < bins.length && c > 0; i++) {
      const fit = Math.min(c, floorE(bins[i] / len));
      if (fit > 0) { bins[i] = round(bins[i] - fit * len, 4); c -= fit; }
    }
    const per = floorE(stock / len);
    while (c > 0) { const k = Math.min(c, per); bins.push(round(stock - k * len, 4)); c -= k; }
  }
  return bins.length;
}
// Choose the commercial length that needs the least purchased steel for one diameter
function optimizeDia(pieceList, dia, F, stockSetting) {
  const lap = lapLen(dia, F);
  const cands = stockSetting === 'auto' ? F.rebar.commercial : [Number(stockSetting)];
  let net = 0;
  for (const p of pieceList) net += p.len * p.n;
  let best = null;
  for (const L of cands) {
    const pieces = new Map(); let splices = 0, ok = true;
    for (const p of pieceList) {
      const segs = splitPiece(p.len, L, lap);
      if (!segs) { ok = false; break; }
      splices += (segs.length - 1) * p.n;
      for (const s of segs) { const k = round(s, 3); pieces.set(k, (pieces.get(k) || 0) + p.n); }
    }
    if (!ok) continue;
    const bars = ffdBars(pieces, L), purchased = bars * L;
    if (!best || purchased < best.purchased - 1e-6 || (Math.abs(purchased - best.purchased) < 1e-6 && bars < best.bars))
      best = {stock: L, bars, purchased, splices};
  }
  if (!best) return null;
  best.dia = dia; best.net = net;
  best.netKg = net * kgpm(dia);
  best.kg = best.purchased * kgpm(dia) * (1 + F.rebar.allowancePct / 100);
  best.wastePct = best.purchased > 0 ? (best.purchased - net) / best.purchased * 100 : 0;
  return best;
}

// ---- Shared element pieces
function newOut() { return {bars: [], lines: [], labor: [], x: 0, info: []}; }
function bar(o, dia, len, n, desc, div = 'REBAR') {
  n = Math.round(n);
  if (n > 0 && len > 0 && dia > 0) o.bars.push({dia: +dia, len: round(len, 3), n, desc, div});
}
function concreteOut(o, vol, cls, F) {
  if (!(vol > 0)) return;
  const c = F.concrete[cls] || F.concrete.A, v = vol * (1 + F.waste.concrete / 100);
  o.lines.push({div: 'CONC', code: 'CEM', qty: v * c.cement}, {div: 'CONC', code: 'SAND', qty: v * c.sand}, {div: 'CONC', code: 'GRAV', qty: v * c.gravel});
  o.labor.push({div: 'CONC', code: 'L_CONC', qty: vol});
  o.info.push(['Concrete', fmt(vol, 3) + ' m³ (class ' + cls + ')']);
}
function formOut(o, area) {
  if (!(area > 0)) return;
  o.lines.push({div: 'FORM', code: 'FORM', qty: area});
  o.labor.push({div: 'FORM', code: 'L_FORM', qty: area});
  o.info.push(['Formwork', fmt(area) + ' m²']);
}
function parseOpenings(text) {
  const res = {area: 0, count: 0, list: [], errors: []};
  String(text || '').split(/[,;\n]+/).map(s => s.trim()).filter(Boolean).forEach(s => {
    const m = s.match(/^([\d.]+)\s*[x×*]\s*([\d.]+)(?:\s*[x×*]\s*(\d+))?$/i);
    if (!m) { res.errors.push(s); return; }
    const w = +m[1], h = +m[2], n = m[3] ? +m[3] : 1;
    res.area += w * h * n; res.count += n; res.list.push({w, h, n});
  });
  return res;
}

// ---- Field helpers for element forms
const N = (k, label, unit, def, step = 'any') => ({k, label, unit, def, t: 'num', step});
const SEL = (k, label, opts, def) => ({k, label, t: 'sel', opts, def});
const CHK = (k, label, def) => ({k, label, t: 'chk', def});
const TXT = (k, label, def, ph) => ({k, label, t: 'txt', def, ph});
const SEC = s => ({sec: s});
const DIA = (k, label, def) => SEL(k, label, DIAS.map(d => [d, d + ' mm']), def);
const CLS = (def = 'A') => SEL('cls', 'Concrete class', ['AA', 'A', 'B', 'C'].map(c => [c, 'Class ' + c]), def);

// ---- Element types
const TYPES = {
  footing: {cat: 'Structural', name: 'Isolated footing', prefix: 'F',
    fields: [SEC('Dimensions'), N('L', 'Length', 'm', 1.5), N('W', 'Width', 'm', 1.5), N('T', 'Thickness', 'm', 0.4), N('cover', 'Cover', 'mm', 75),
      SEC('Bottom bars'), DIA('dL', 'Bars along length', 16), N('sL', 'Spacing', 'mm', 150), DIA('dW', 'Bars along width', 16), N('sW', 'Spacing', 'mm', 150),
      CHK('hook', '90° hooks both ends (12d)', true),
      SEC('Concrete'), CLS(), CHK('form', 'Include formwork (sides)', true)],
    calc(i, F) {
      const o = newOut(), c = i.cover / 1000;
      const nL = countAcross(i.W - 2 * c, i.sL / 1000), nW = countAcross(i.L - 2 * c, i.sW / 1000);
      bar(o, i.dL, i.L - 2 * c + (i.hook ? 2 * hook90(i.dL, F) : 0), nL, 'Bottom bars along L');
      bar(o, i.dW, i.W - 2 * c + (i.hook ? 2 * hook90(i.dW, F) : 0), nW, 'Bottom bars along W');
      o.x = nL * nW;
      concreteOut(o, i.L * i.W * i.T, i.cls, F);
      if (i.form) formOut(o, 2 * (i.L + i.W) * i.T);
      return o;
    }},
  wallfooting: {cat: 'Structural', name: 'Wall footing', prefix: 'WF',
    fields: [SEC('Dimensions'), N('L', 'Length (run)', 'm', 10), N('B', 'Width', 'm', 0.6), N('T', 'Thickness', 'm', 0.25), N('cover', 'Cover', 'mm', 75),
      SEC('Bars'), DIA('dT', 'Transverse bars', 12), N('sT', 'Spacing', 'mm', 200), CHK('hook', '90° hooks on transverse bars', false),
      DIA('dLn', 'Longitudinal bars', 10), N('nLn', 'No. of longitudinal bars', 'pcs', 4, 1),
      SEC('Concrete'), CLS(), CHK('form', 'Include formwork (sides)', true)],
    calc(i, F) {
      const o = newOut(), c = i.cover / 1000;
      const nT = countAcross(i.L - 2 * c, i.sT / 1000);
      bar(o, i.dT, i.B - 2 * c + (i.hook ? 2 * hook90(i.dT, F) : 0), nT, 'Transverse bars');
      bar(o, i.dLn, i.L - 2 * c, i.nLn, 'Longitudinal bars');
      o.x = nT * i.nLn;
      concreteOut(o, i.L * i.B * i.T, i.cls, F);
      if (i.form) formOut(o, 2 * i.L * i.T);
      return o;
    }},
  column: {cat: 'Structural', name: 'Column', prefix: 'C',
    fields: [SEC('Dimensions'), N('b', 'Width b', 'm', 0.4), N('h', 'Depth h', 'm', 0.4), N('H', 'Height', 'm', 3.0), N('cover', 'Cover', 'mm', 40),

// Fill missing inputs with defaults, coerce numbers
function normInputs(type, inp) {
  const out = {};
  for (const f of TYPES[type].fields) {
    if (!f.k) continue;
    let v = inp && inp[f.k] !== undefined ? inp[f.k] : f.def;
    if (f.t === 'num') v = Number(v) || 0;
    else if (f.t === 'chk') v = !!v;
    else if (f.t === 'sel' && typeof f.def === 'number') v = Number(v);
    out[f.k] = v;
  }
  return out;
}
function computeElement(el, F) {
  const o = TYPES[el.type].calc(normInputs(el.type, el.inp), F);
  const kg = o.bars.reduce((s, b) => s + b.len * b.n * kgpm(b.dia), 0);
  if (o.bars.length) o.info.unshift(['Rebar (net, 1 element)', fmt(kg) + ' kg']);
  o.kg = kg;
  return o;
}

// Build the whole estimate: per level, per division quantities and costs
function buildEstimate(st) {
  const F = st.factors, set = st.settings, levels = [];
  for (const lv of st.levels) {
    const els = st.elements.filter(e => e.level === lv.id);
    const divs = {};
    const D = k => divs[k] || (divs[k] = {lines: new Map(), labor: new Map(), bars: new Map(), x: 0, rebar: []});
    for (const el of els) {
      const q = Math.max(0, Math.round(+el.qty || 0)), r = computeElement(el, F);
      for (const b of r.bars) {
        const d = D(b.div), arr = d.bars.get(b.dia) || [];
        arr.push({len: b.len, n: b.n * q}); d.bars.set(b.dia, arr);
      }
      if (r.bars.length && r.x) D(r.bars[0].div).x += r.x * q;
      for (const l of r.lines) { const d = D(l.div); d.lines.set(l.code, (d.lines.get(l.code) || 0) + l.qty * q); }
      for (const l of r.labor) { const d = D(l.div); d.labor.set(l.code, (d.labor.get(l.code) || 0) + l.qty * q); }
    }
    for (const [k, d] of Object.entries(divs)) {
      let netKg = 0;
      for (const dia of [...d.bars.keys()].sort((a, b) => a - b)) {
        const opt = optimizeDia(d.bars.get(dia), dia, F, set.stock);
        if (!opt) continue;
        d.rebar.push(opt); netKg += opt.netKg;
        d.lines.set('RB' + dia, (d.lines.get('RB' + dia) || 0) + opt.kg);
      }
      if (d.x > 0) d.lines.set('TW', (d.lines.get('TW') || 0) + d.x * F.rebar.tieWirePerX / F.rebar.tieWireMPerKg);
      if (k === 'REBAR' && netKg > 0) d.labor.set('L_RB', (d.labor.get('L_RB') || 0) + netKg);
    }
    levels.push({level: lv, divs});

}

    rows.push({kind: 'div', text: dname});
    let divTotal = 0;
    for (const {level, divs} of parts) {
      const d = divs[dk];

      let mat = 0, lab = 0;

        }
      }
      rows.push({kind: 'sub', text: 'Subtotal – ' + level.name, mat, lab, amt: mat + lab});
      divTotal += mat + lab;
    }
    divTotals.push({div: dk, name: dname, amt: divTotal});
  }
  const s = st.settings, direct = divTotals.reduce((a, b) => a + b.amt, 0);
  const ocm = direct * s.ocm / 100, profit = direct * s.profit / 100, cont = direct * s.contingency / 100;
  const sub = direct + ocm + profit + cont, vat = sub * s.vat / 100;
  return {rows, divTotals, totals: {direct, ocm, profit, cont, sub, vat, grand: sub + vat}, est};
}

// ---- Self-test: hand-calculated worked examples
function runSelfTests() {
  const F = defaultFactors(), res = [];
  const near = (a, b, tol = 0.01) => Math.abs(a - b) <= tol;
  const t = (name, fn) => { try { const fails = []; fn((label, got, exp, tol) => { if (!near(got, exp, tol)) fails.push(`${label}: got ${round(got, 4)}, expected ${exp}`); }); res.push({name, ok: !fails.length, fails}); } catch (e) { res.push({name, ok: false, fails: [String(e)]}); } };
  const line = (o, code) => o.lines.filter(l => l.code === code).reduce((s, l) => s + l.qty, 0);
  const el = (type, inp) => computeElement({type, inp}, F);

  t('Bar weight d²/162', eq => { eq('16mm kg/m', kgpm(16), 1.5802, 1e-4); eq('10mm kg/m', kgpm(10), 0.6173, 1e-4); });
  t('Column 0.4×0.4×3.0, 8-16mm, 10mm ties @150', eq => {
    const o = el('column', {b: 0.4, h: 0.4, H: 3, cover: 40, nM: 8, dM: 16, lapTop: true, botAnch: 0, dT: 10, sT: 150, Lo: 0, ct: 0, cls: 'A', form: true});
    const m = o.bars.find(b => b.desc === 'Main bars'), ti = o.bars.find(b => b.desc === 'Ties');
    eq('main bar length (3.0 + 40×16mm lap)', m.len, 3.64); eq('main bars', m.n, 8);
    eq('ties count ceil(3/0.15)+1', ti.n, 21); eq('tie cut length 4×0.32 + 2×0.075', ti.len, 1.43);
    eq('rebar kg', o.kg, 3.64 * 8 * kgpm(16) + 1.43 * 21 * kgpm(10));
    eq('concrete m³ (no waste)', line(o, 'GRAV') / 1.05, 0.48, 1e-6); eq('formwork m²', line(o, 'FORM'), 4.8, 1e-6);
    eq('cement bags (0.48 × 1.05 × 9)', line(o, 'CEM'), 4.536, 1e-6); eq('intersections', o.x, 168);
  });
  t('Footing 1.5×1.5×0.4, 16mm @150 both ways, hooks', eq => {
    const o = el('footing', {L: 1.5, W: 1.5, T: 0.4, cover: 75, dL: 16, sL: 150, dW: 16, sW: 150, hook: true, cls: 'A', form: true});
    eq('bars each way floor(1.35/0.15)+1', o.bars[0].n, 10); eq('bar length 1.35 + 2×0.192', o.bars[0].len, 1.734);
  });
  t('Lap splitting & commercial length', eq => {
    eq('8.0 m bar on 6 m stock, lap 0.64', splitPiece(8, 6, 0.64).length, 2);
    eq('second piece 8 - 6 + 0.64', splitPiece(8, 6, 0.64)[1], 2.64, 1e-6);
    const o = optimizeDia([{len: 3.64, n: 8}], 16, F, '6');
    eq('8 × 3.64 m on 6 m bars = 8 bars', o.bars, 8);
    const a = optimizeDia([{len: 3.64, n: 8}], 16, F, 'auto');
    eq('auto picks 7.5 m (2 pcs per bar → 4 bars, 30 m)', a.purchased, 30);
    eq('ties 1.43 × 21 on 6 m = 6 bars (4 per bar)', optimizeDia([{len: 1.43, n: 21}], 10, F, '6').bars, 6);
  });
  t('CHB wall 5×3 m, 1 door 0.9×2.1, 4" class B, plaster 2 faces 16mm class B', eq => {
    const o = el('chbwall', {L: 5, H: 3, open: '0.9x2.1x1', size: '4', mcls: 'B', waste: 0, faces: 2, plt: 16, pcls: 'B', dV: 10, sV: 0.6, vX: 0.4, dH: 10, cH: 3});
    eq('CHB pcs 13.11 × 12.5', line(o, 'CHB4'), 163.875, 1e-6);
    eq('cement: mortar 6.8434 + plaster 5.0342', line(o, 'CEM'), 13.11 * 0.522 + 26.22 * 0.016 * 12, 1e-6);
    eq('sand: 0.5703 + 0.4195', line(o, 'SAND'), 13.11 * 0.0435 + 26.22 * 0.016, 1e-6);
    eq('vertical bars ceil(5/0.6)+1', o.bars[0].n, 10); eq('horizontal rows floor(3/0.6)', o.bars[1].n, 5);
  });
  t('Gypsum ceiling 5×4 m, furring @0.4, no waste', eq => {
    const o = el('ceiling', {L: 5, W: 4, sys: 'gyp', board: 'GYP9', fsp: 0.4, waste: 0});
    const F0 = F.waste.metal; F.waste.metal = 0; const o2 = el('ceiling', {L: 5, W: 4, sys: 'gyp', board: 'GYP9', fsp: 0.4, waste: 0}); F.waste.metal = F0;
    eq('boards 20 / 2.9768', line(o, 'GYP9'), 20 / 2.9768, 1e-6);
    eq('carrying channel 5 rows × 5 m / 5 m', line(o2, 'CC'), 5, 1e-6);
    eq('furring 14 rows × 4 m / 5 m', line(o2, 'MF'), 11.2, 1e-6);
    eq('wall angle 18 m / 3 m', line(o2, 'WA'), 6, 1e-6);
  });
  t('Drywall 4×3 m, gypsum 2 faces, studs @406, no waste', eq => {
    const F0 = F.waste.metal; F.waste.metal = 0;
    const o = el('drywall', {L: 4, H: 3, open: '', board: 'GYP12', faces: 2, sp: 0.406, ins: false, waste: 0}); F.waste.metal = F0;
    eq('studs ceil(4/0.406)+1', line(o, 'STUD'), 11, 1e-6); eq('track 8 m / 3 m', line(o, 'TRK'), 8 / 3, 1e-6);
    eq('boards 24 / 2.9768', line(o, 'GYP12'), 24 / 2.9768, 1e-6); eq('screws 9 boards × 30', line(o, 'CSCR'), 270, 1e-6);
  });
  t('Openings parser', eq => { const p = parseOpenings('0.9x2.1x2, 1.2 x 1.2'); eq('area', p.area, 5.22, 1e-6); eq('count', p.count, 3); });
  return res;
}

<script id="app">
'use strict';
const KEY = 'estimator.v1';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const peso = x => '₱' + fmt(x);

function defaultState() {
  return {
    version: 1,
    project: {name: 'New project', location: '', owner: '', date: new Date().toISOString().slice(0, 10), notes: ''},
    settings: {stock: 'auto', ocm: 8, profit: 10, contingency: 5, vat: 12},
    levels: [{id: uid(), name: 'Ground floor', h: 3.0}],
    elements: [],
    prices: Object.fromEntries(MATERIALS.map(([c, n, u, p]) => [c, {name: n, unit: u, price: p}])),
    labor: Object.fromEntries(LABOR.map(([c, d, n, u, m, r]) => [c, {div: d, name: n, unit: u, mode: m, rate: r}])),
    factors: defaultFactors(),
  };
}
function deepMerge(base, over) {
  if (over === undefined || over === null) return base;
  if (Array.isArray(base) || typeof base !== 'object' || base === null) return over;
  const out = {...base};
  for (const k of Object.keys(over)) out[k] = (k in base) ? deepMerge(base[k], over[k]) : over[k];
  return out;
}
function loadState(raw) {
  const d = defaultState();
  if (!raw || typeof raw !== 'object') return d;
  const st = deepMerge(d, raw);
  st.elements = (Array.isArray(raw.elements) ? raw.elements : []).filter(e => e && TYPES[e.type]);
  st.levels = Array.isArray(raw.levels) && raw.levels.length ? raw.levels : d.levels;
  return st;
}

let S;
try { S = loadState(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { S = defaultState(); }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const TABS = [['project', 'Project'], ['elements', 'Elements'], ['rebar', 'Rebar schedule'], ['boq', 'BOQ & Cost'], ['prices', 'Prices'], ['factors', 'Factors']];
let cur = 'elements', levelFilter = 'all', draft = null;
try { cur = localStorage.getItem(KEY + '.tab') || cur; } catch (e) {}
if (location.hash === '#selftest') cur = 'selftest';

const App = {
  tab(t) { cur = t; try { localStorage.setItem(KEY + '.tab', t); } catch (e) {} render(); },
  set(path, val) {
    const ks = path.split('.'); let o = S;
    while (ks.length > 1) o = o[ks.shift()];
    o[ks[0]] = val; persist();
  },
  newProject() {
    if (!confirm('Start a new project? Unsaved changes in this browser will be replaced. (Save a project file first if needed.)')) return;
    S = defaultState(); persist(); render();
  },
  saveFile() {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type: 'application/json'});
    download(blob, (S.project.name || 'project').replace(/[^\w\- ]+/g, '').trim() + '.estimate.json');
  },
  openFile() { document.getElementById('fileIn').click(); },
  addLevel() { S.levels.push({id: uid(), name: 'Level ' + (S.levels.length + 1), h: 3.0}); persist(); render(); },
  delLevel(id) {
    const n = S.elements.filter(e => e.level === id).length;
    if (S.levels.length === 1) return alert('A project needs at least one level.');
    if (n && !confirm(`Delete this level and its ${n} element(s)?`)) return;
    S.levels = S.levels.filter(l => l.id !== id); S.elements = S.elements.filter(e => e.level !== id); persist(); render();
  },
  moveLevel(id, d) { const i = S.levels.findIndex(l => l.id === id), j = i + d; if (j < 0 || j >= S.levels.length) return; [S.levels[i], S.levels[j]] = [S.levels[j], S.levels[i]]; persist(); render(); },
  filter(v) { levelFilter = v; render(); },
  addEl(type) {
    const lv = levelFilter !== 'all' ? levelFilter : S.levels[0].id;
    const n = S.elements.filter(e => e.type === type).length + 1;
    openEditor({id: null, type, mark: TYPES[type].prefix + n, level: lv, qty: 1, inp: normInputs(type, {})});
  },
  editEl(id) { const e = S.elements.find(x => x.id === id); if (e) openEditor(JSON.parse(JSON.stringify(e))); },
  copyEl(id) {
    const e = S.elements.find(x => x.id === id); if (!e) return;
    const c = JSON.parse(JSON.stringify(e)); c.id = null; c.mark = e.mark + '-copy'; openEditor(c);
  },
  delEl(id) { const e = S.elements.find(x => x.id === id); if (e && confirm(`Delete ${e.mark}?`)) { S.elements = S.elements.filter(x => x.id !== id); persist(); render(); } },
  resetPrices() { if (confirm('Reset all material and labor prices to the sample defaults?')) { const d = defaultState(); S.prices = d.prices; S.labor = d.labor; persist(); render(); } },
  resetFactors() { if (confirm('Reset all factors to defaults?')) { S.factors = defaultFactors(); persist(); render(); } },
  exportXls() { download(new Blob([boqHtmlTable(true)], {type: 'application/vnd.ms-excel'}), fileBase() + ' BOQ.xls'); },
  exportCsv() { download(new Blob(['﻿' + boqCsv()], {type: 'text/csv'}), fileBase() + ' BOQ.csv'); },
  print() { window.print(); },
};
window.App = App;
const fileBase = () => (S.project.name || 'project').replace(/[^\w\- ]+/g, '').trim();
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
document.getElementById('fileIn').addEventListener('change', ev => {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { S = loadState(JSON.parse(r.result)); persist(); render(); } catch (e) { alert('Could not open file: ' + e.message); } };
  r.readAsText(f); ev.target.value = '';
});

// ---- Rendering
function render() {
  document.getElementById('projName').textContent = S.project.name + (S.project.location ? ' · ' + S.project.location : '');
  document.getElementById('tabs').innerHTML = TABS.map(([k, n]) => `<button class="${k === cur ? 'on' : ''}" onclick="App.tab('${k}')">${n}</button>`).join('');
  const v = document.getElementById('view');
  const fn = {project: vProject, elements: vElements, rebar: vRebar, boq: vBOQ, prices: vPrices, factors: vFactors, selftest: vSelfTest}[cur] || vElements;
  v.innerHTML = fn();
}
const inp = (path, val, type = 'text', extra = '') =>
  `<input type="${type}" value="${esc(val)}" ${type === 'number' ? 'step="any"' : ''} ${extra} onchange="App.set('${path}', this.type==='number'?Number(this.value):this.value);render()">`;
const field = (label, html, unit = '') => `<label class="f">${esc(label)}${unit ? ` <span class="u">(${esc(unit)})</span>` : ''}${html}</label>`;

function vProject() {
  const p = S.project, s = S.settings;
  const stockOpts = [['auto', 'Auto – least waste of ' + S.factors.rebar.commercial.join(' / ') + ' m'], ...S.factors.rebar.commercial.map(c => [String(c), c + ' m only'])];
  return `
  <section class="card"><h2>Project information</h2>

    </table></div>
    <div style="margin-top:8px"><button class="btn" onclick="App.addLevel()">+ Add level</button></div>

  <section class="card"><h2>Estimate settings</h2>
    <div class="grid">
      ${field('Commercial bar length', `<select onchange="App.set('settings.stock',this.value);render()">${stockOpts.map(([v, n]) => `<option value="${v}" ${String(s.stock) === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`)}
      ${field('OCM (overhead, contingencies, misc.)', inp('settings.ocm', s.ocm, 'number'), '% of direct cost')}

function vElements() {
  const cats = {};
  for (const [k, t] of Object.entries(TYPES)) (cats[t.cat] = cats[t.cat] || []).push([k, t]);
  const list = S.elements.filter(e => levelFilter === 'all' || e.level === levelFilter);

  }).join('');

  </section>
  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Elements (${list.length})</h2>
      <label class="row" style="gap:6px">Level <select style="width:auto" onchange="App.filter(this.value)"><option value="all">All levels</option>${S.levels.map(l => `<option value="${l.id}" ${levelFilter === l.id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></label></div>
    ${list.length ? `<div class="tbl-wrap"><table><tr><th>Mark</th><th>Type</th><th>Level</th><th class="n">Qty</th><th>Result (per element)</th><th></th></tr>${rows}</table></div>`

// ---- Element editor
function openEditor(el) {
  draft = el;
  const t = TYPES[el.type], dlg = document.getElementById('dlg');
  const fieldsHtml = t.fields.map(f => {
    if (f.sec) return `<div class="secttl">${esc(f.sec)}</div>`;
    const v = el.inp[f.k], id = 'f_' + f.k;
    if (f.t === 'chk') return `<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;

  }).join('');

    <div class="dlg-h"><h2>${el.id ? 'Edit' : 'New'} ${esc(t.name)}</h2><button class="btn sm" onclick="closeEditor()">✕</button></div>

      <div>
        <div class="grid">
          ${field('Mark', `<input id="e_mark" value="${esc(el.mark)}">`)}
          ${field('Level', `<select id="e_level">${S.levels.map(l => `<option value="${l.id}" ${l.id === el.level ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>`)}
          ${field('Quantity (same elements)', `<input id="e_qty" type="number" step="1" min="0" value="${el.qty}">`, 'pcs')}
        </div>
        <div class="grid" style="margin-top:6px">${fieldsHtml}</div>
      </div>
      <div class="preview" id="pv"></div>
    </div>
    <div class="dlg-f"><button class="btn" onclick="closeEditor()">Cancel</button><button class="btn pri" onclick="saveEditor()">Save element</button></div>`;
  dlg.oninput = dlg.onchange = () => { readEditor(); preview(); };
  preview();
  if (!dlg.open) dlg.showModal();
}
function readEditor() {
  const t = TYPES[draft.type], g = id => document.getElementById(id);
  draft.mark = g('e_mark').value.trim() || draft.mark; draft.level = g('e_level').value; draft.qty = Math.max(0, Math.round(Number(g('e_qty').value) || 0));

}
function preview() {
  const pv = document.getElementById('pv');
  let r;
  try { r = computeElement(draft, S.factors); } catch (e) { pv.innerHTML = `<p class="err">Check inputs: ${esc(e.message)}</p>`; return; }
  const q = draft.qty, P = S.prices;

  pv.innerHTML = `
    <div class="kv">${r.info.map(([a, b]) => `<span class="muted">${esc(a)}</span><b>${esc(b)}</b>`).join('')}</div>

      ${r.bars.map(b => `<tr><td>${esc(b.desc)}</td><td class="n">${b.dia}</td><td class="n">${fmt(b.len, 3)}</td><td class="n">${b.n}</td><td class="n">${fmt(b.len * b.n * kgpm(b.dia))}</td></tr>`).join('')}</table>` : ''}
    ${agg.size ? `<h4>Materials (× ${q} element${q === 1 ? '' : 's'}, before rounding)</h4><table>${[...agg].map(([c, v]) => `<tr><td>${esc(P[c].name)}</td><td class="n">${fmt(v * q, 3)}</td><td>${esc(P[c].unit)}</td></tr>`).join('')}</table>` : ''}
    ${r.bars.length ? `<p class="muted" style="font-size:12px">Rebar purchase (commercial lengths, laps, tie wire) is optimized per level on the Rebar schedule tab.</p>` : ''}`;
}
function saveEditor() {
  readEditor();
  if (draft.id) { const i = S.elements.findIndex(e => e.id === draft.id); S.elements[i] = draft; }
  else { draft.id = uid(); S.elements.push(draft); }
  persist(); closeEditor(); render();
}
function closeEditor() { document.getElementById('dlg').close(); draft = null; }
window.closeEditor = closeEditor; window.saveEditor = saveEditor;

function vRebar() {
  const est = buildEstimate(S), F = S.factors;
  const proj = new Map();
  let html = `<section class="card"><h2>Rebar schedule</h2><p class="muted">Cut lengths include hooks and laps. Bars longer than the commercial length are spliced with a lap of ${F.rebar.lapFactor}d. Purchase quantities are optimized per level and work division.</p></section>`;
  for (const {level, divs} of est) {
    const els = S.elements.filter(e => e.level === level.id);
    const withBars = els.map(e => ({e, r: computeElement(e, F)})).filter(x => x.r.bars.length);
    if (!withBars.length) continue;
    html += `<section class="card"><h2>${esc(level.name)}</h2><div class="tbl-wrap"><table>
      <tr><th>Mark</th><th>Bar</th><th class="n">Ø mm</th><th class="n">Cut length (m)</th><th class="n">No. / element</th><th class="n">Elements</th><th class="n">Total length (m)</th><th class="n">Weight (kg)</th></tr>
      ${withBars.map(({e, r}) => r.bars.map((b, i) => `<tr><td>${i ? '' : '<b>' + esc(e.mark) + '</b>'}</td><td>${esc(b.desc)}</td><td class="n">${b.dia}</td><td class="n">${fmt(b.len, 3)}</td><td class="n">${b.n}</td><td class="n">${e.qty}</td><td class="n">${fmt(b.len * b.n * e.qty)}</td><td class="n">${fmt(b.len * b.n * e.qty * kgpm(b.dia))}</td></tr>`).join('')).join('')}
      </table></div>
      <h3>Purchase list</h3><div class="tbl-wrap"><table><tr><th>Division</th><th class="n">Ø mm</th><th class="n">Net length (m)</th><th class="n">Splices</th><th class="n">Commercial length</th><th class="n">Bars to buy</th><th class="n">Weight to buy (kg)</th><th class="n">Waste incl. laps</th></tr>
      ${Object.entries(divs).flatMap(([dk, d]) => d.rebar.map(o => {
        const k = o.dia + '|' + o.stock, p = proj.get(k) || {dia: o.dia, stock: o.stock, bars: 0, kg: 0}; p.bars += o.bars; p.kg += o.kg; proj.set(k, p);
        return `<tr><td>${esc(DIV_NAME[dk])}</td><td class="n">${o.dia}</td><td class="n">${fmt(o.net)}</td><td class="n">${o.splices}</td><td class="n">${o.stock} m</td><td class="n"><b>${o.bars}</b></td><td class="n">${fmt(o.kg)}</td><td class="n">${fmt(o.wastePct, 1)}%</td></tr>`;
      })).join('')}
      </table></div>
      ${Object.values(divs).some(d => d.x) ? `<p class="muted">Tie wire #16: ${fmt(Object.values(divs).reduce((s, d) => s + d.x, 0) * F.rebar.tieWirePerX / F.rebar.tieWireMPerKg)} kg (${Object.values(divs).reduce((s, d) => s + d.x, 0)} intersections × ${F.rebar.tieWirePerX} m ÷ ${F.rebar.tieWireMPerKg} m/kg)</p>` : ''}
    </section>`;
  }
  if (!proj.size) return html + `<section class="card"><p class="muted">No reinforced elements yet.</p></section>`;
  const tot = [...proj.values()].sort((a, b) => a.dia - b.dia || a.stock - b.stock);
  html += `<section class="card"><h2>Project total – rebar to order</h2><div class="tbl-wrap"><table><tr><th class="n">Ø mm</th><th class="n">Length</th><th class="n">Pieces</th><th class="n">Weight (kg)</th></tr>
    ${tot.map(p => `<tr><td class="n">${p.dia}</td><td class="n">${p.stock} m</td><td class="n"><b>${p.bars}</b></td><td class="n">${fmt(p.kg)}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">Total</td><td class="n">${tot.reduce((s, p) => s + p.bars, 0)}</td><td class="n">${fmt(tot.reduce((s, p) => s + p.kg, 0))}</td></tr></table></div></section>`;
  return html;
}

function boqHtmlTable(forExcel) {
  const b = buildBOQ(S), p = S.project, num = (x, d = 2) => forExcel ? round(x, d) : fmt(x, d);
  let i = 0;
  const body = b.rows.map(r => {
    if (r.kind === 'div') { i = 0; return `<tr class="div"><td colspan="6">${esc(r.text)}</td></tr>`; }
    if (r.kind === 'lvl') return `<tr class="lvl"><td></td><td colspan="5">${esc(r.text)}</td></tr>`;
    if (r.kind === 'sub') return `<tr class="sub"><td></td><td colspan="4">${esc(r.text)} <span class="muted">(materials ${forExcel ? round(r.mat, 2) : peso(r.mat)} + labor ${forExcel ? round(r.lab, 2) : peso(r.lab)})</span></td><td class="n">${num(r.amt)}</td></tr>`;
    i++;
    return `<tr><td class="n">${i}</td><td>${esc(r.name)}</td><td class="n">${r.pct ? num(r.qty) : num(r.qty, r.kind === 'mat' && CEIL_UNITS.has(r.unit) ? 0 : 2)}</td><td>${esc(r.unit)}</td><td class="n">${r.pct ? 'of ' + num(r.rate) : num(r.rate)}</td><td class="n">${num(r.amt)}</td></tr>`;
  }).join('');
  const T = b.totals, s = S.settings;
  const sum = `
    <tr><td colspan="6">&nbsp;</td></tr>
    <tr class="div"><td colspan="6">Summary</td></tr>
    ${b.divTotals.map(d => `<tr><td></td><td colspan="4">${esc(d.name)}</td><td class="n">${num(d.amt)}</td></tr>`).join('')}
    <tr class="sub"><td></td><td colspan="4">Total direct cost</td><td class="n">${num(T.direct)}</td></tr>
    <tr><td></td><td colspan="4">OCM (${s.ocm}%)</td><td class="n">${num(T.ocm)}</td></tr>
    <tr><td></td><td colspan="4">Contractor's profit (${s.profit}%)</td><td class="n">${num(T.profit)}</td></tr>
    <tr><td></td><td colspan="4">Contingency (${s.contingency}%)</td><td class="n">${num(T.cont)}</td></tr>
    <tr class="sub"><td></td><td colspan="4">Subtotal</td><td class="n">${num(T.sub)}</td></tr>
    <tr><td></td><td colspan="4">VAT (${s.vat}%)</td><td class="n">${num(T.vat)}</td></tr>
    <tr class="tot"><td></td><td colspan="4">TOTAL PROJECT COST</td><td class="n">${num(T.grand)}</td></tr>`;
  const head = `<tr><th class="n">Item</th><th>Description</th><th class="n">Qty</th><th>Unit</th><th class="n">Unit cost (₱)</th><th class="n">Amount (₱)</th></tr>`;
  const title = `<tr><td colspan="6"><b>BILL OF QUANTITIES – ${esc(p.name)}</b></td></tr><tr><td colspan="6">${esc([p.location, p.owner, p.date].filter(Boolean).join(' · '))}</td></tr>`;
  const table = `<table>${title}${head}${b.rows.length ? body : '<tr><td colspan="6">No elements yet.</td></tr>'}${b.rows.length ? sum : ''}</table>`;
  if (!forExcel) return table;
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><style>td,th{border:.5pt solid #ccc;font-family:Calibri}.div td{background:#dce6f5;font-weight:bold}.sub td,.tot td{font-weight:bold}.n{text-align:right}</style></head><body>${table}</body></html>`;
}
function boqCsv() {
  const b = buildBOQ(S), q = v => `"${String(v).replace(/"/g, '""')}"`, out = [['Item', 'Description', 'Qty', 'Unit', 'Unit cost', 'Amount']];
  let i = 0;
  for (const r of b.rows) {
    if (r.kind === 'div') { i = 0; out.push(['', r.text]); }
    else if (r.kind === 'lvl') out.push(['', r.text]);
    else if (r.kind === 'sub') out.push(['', r.text, '', '', '', round(r.amt, 2)]);
    else out.push([++i, r.name, r.qty, r.unit, r.pct ? 'of ' + round(r.rate, 2) : r.rate, round(r.amt, 2)]);
  }
  const T = b.totals;
  out.push([], ['', 'Total direct cost', '', '', '', round(T.direct, 2)], ['', 'OCM', '', '', '', round(T.ocm, 2)], ['', 'Profit', '', '', '', round(T.profit, 2)],
    ['', 'Contingency', '', '', '', round(T.cont, 2)], ['', 'VAT', '', '', '', round(T.vat, 2)], ['', 'TOTAL PROJECT COST', '', '', '', round(T.grand, 2)]);
  return out.map(r => r.map(q).join(',')).join('\r\n');
}
function vBOQ() {
  const T = buildBOQ(S).totals;
  return `
  <section class="card noprint"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Bill of Quantities & Cost</h2>
    <div class="row"><button class="btn" onclick="App.exportXls()">Export Excel</button><button class="btn" onclick="App.exportCsv()">Export CSV</button><button class="btn pri" onclick="App.print()">Print / PDF</button></div></div>
    <p class="muted" style="margin:8px 0 0">Total project cost: <b style="color:var(--ink);font-size:16px">${peso(T.grand)}</b> · Direct cost ${peso(T.direct)}</p>
    <div class="note">Sample prices are placeholders. Update the <a href="#" onclick="App.tab('prices');return false">Prices</a> tab with your supplier and labor rates before using this estimate.</div>
  </section>
  <section class="card"><div class="tbl-wrap">${boqHtmlTable(false)}</div></section>`;
}

function vPrices() {
  const byDiv = {};
  for (const [c, d] of LABOR) (byDiv[d] = byDiv[d] || []).push(c);
  return `
  <section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Material prices</h2><button class="btn sm" onclick="App.resetPrices()">Reset to sample prices</button></div>
    <div class="note">Seeded with sample prices only. Enter your current supplier prices.</div>
    <div class="tbl-wrap"><table><tr><th>Code</th><th>Material</th><th>Unit</th><th class="n">Unit price (₱)</th></tr>
    ${MATERIALS.map(([c]) => { const m = S.prices[c]; return `<tr><td class="muted">${c}</td><td><input value="${esc(m.name)}" onchange="S.prices['${c}'].name=this.value;persist()"></td><td>${esc(m.unit)}</td>
      <td class="n"><input type="number" step="any" style="max-width:130px;text-align:right" value="${m.price}" onchange="S.prices['${c}'].price=Number(this.value);persist()"></td></tr>`; }).join('')}
    </table></div></section>
  <section class="card"><h2>Labor rates</h2>
    <p class="muted">Per unit (₱ per m², kg, m³, set), or as a % of the materials cost of that division.</p>
    <div class="tbl-wrap"><table><tr><th>Division</th><th>Labor item</th><th>Unit</th><th>Basis</th><th class="n">Rate</th></tr>
    ${LABOR.map(([c, d]) => { const l = S.labor[c]; return `<tr><td class="muted">${esc(DIV_NAME[d])}</td><td><input value="${esc(l.name)}" onchange="S.labor['${c}'].name=this.value;persist()"></td><td>${esc(l.unit)}</td>
      <td><select onchange="S.labor['${c}'].mode=this.value;persist();render()"><option value="unit" ${l.mode === 'unit' ? 'selected' : ''}>₱ per ${esc(l.unit)}</option><option value="pct" ${l.mode === 'pct' ? 'selected' : ''}>% of materials</option></select></td>
      <td class="n"><input type="number" step="any" style="max-width:110px;text-align:right" value="${l.rate}" onchange="S.labor['${c}'].rate=Number(this.value);persist()"></td></tr>`; }).join('')}
    </table></div></section>`;
}

function vFactors() {
  const F = S.factors;
  const numIn = (path, v) => `<input type="number" step="any" value="${v}" onchange="App.set('factors.${path}',Number(this.value))">`;
  const group = (title, path, obj, labels = {}, note = '') => `<section class="card"><h2>${title}</h2>${note ? `<div class="note">${note}</div>` : ''}<div class="grid">
    ${Object.entries(obj).filter(([, v]) => typeof v === 'number').map(([k, v]) => field(labels[k] || k, numIn(path + '.' + k, v))).join('')}</div></section>`;
  const table = (title, path, obj, cols, note) => `<section class="card"><h2>${title}</h2>${note ? `<div class="note">${note}</div>` : ''}<div class="tbl-wrap"><table><tr><th></th>${cols.map(c => `<th class="n">${c[1]}</th>`).join('')}</tr>
    ${Object.entries(obj).map(([r, o]) => `<tr><td><b>${r}</b></td>${cols.map(([c]) => `<td class="n"><input type="number" step="any" style="max-width:100px;text-align:right" value="${o[c]}" onchange="App.set('factors.${path}.${r}.${c}',Number(this.value))"></td>`).join('')}</tr>`).join('')}</table></div></section>`;
  return `
  <section class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Estimating factors</h2><button class="btn sm" onclick="App.resetFactors()">Reset to defaults</button></div>
    <p class="muted">These factors are saved with this project. Changing them updates every element.</p></section>
  <section class="card"><h2>Rebar (NSCP defaults)</h2><div class="grid">
    ${field('Lap splice', numIn('rebar.lapFactor', F.rebar.lapFactor), '× bar diameter')}
    ${field('Tie hook extension (135°)', numIn('rebar.tieHookD', F.rebar.tieHookD), '× bar diameter')}
    ${field('Tie hook minimum', numIn('rebar.tieHookMin', F.rebar.tieHookMin), 'mm')}
    ${field('90° hook extension', numIn('rebar.hook90D', F.rebar.hook90D), '× bar diameter')}
    ${field('Tie wire per intersection', numIn('rebar.tieWirePerX', F.rebar.tieWirePerX), 'm')}
    ${field('#16 tie wire length per kg', numIn('rebar.tieWireMPerKg', F.rebar.tieWireMPerKg), 'm/kg')}
    ${field('Extra allowance on rebar', numIn('rebar.allowancePct', F.rebar.allowancePct), '%')}
    ${field('Commercial lengths', `<input value="${F.rebar.commercial.join(', ')}" onchange="S.factors.rebar.commercial=this.value.split(/[ ,;]+/).map(Number).filter(x=>x>0).sort((a,b)=>a-b);if(!S.factors.rebar.commercial.length)S.factors.rebar.commercial=[6];persist();render()">`, 'm, comma separated')}
  </div></section>
  ${table('Concrete mix per m³ (40 kg bags)', 'concrete', F.concrete, [['cement', 'Cement (bags)'], ['sand', 'Sand (m³)'], ['gravel', 'Gravel (m³)']], 'VERIFY: common Fajardo-style proportions. Check against your references.')}
  ${table('CHB laying mortar per m² of wall', 'chb.mortar', F.chb.mortar, [['A', 'Class A (bags)'], ['B', 'Class B (bags)'], ['C', 'Class C (bags)'], ['sand', 'Sand (m³)']], 'VERIFY: 4" and 6" are common PH table values; 5" is interpolated.')}
  ${group('CHB', 'chb', F.chb, {perSqm: 'Blocks per m²', courseH: 'Course height (m)'})}
  ${group('Plaster mortar per m³', 'plaster', F.plaster, {A: 'Class A (bags/m³)', B: 'Class B (bags/m³)', C: 'Class C (bags/m³)', D: 'Class D (bags/m³)', sandPerCum: 'Sand (m³ per m³)'}, 'VERIFY: plaster cement = area × thickness × bags/m³.')}
  ${table('Board sizes (m)', 'boards', F.boards, [['w', 'Width'], ['l', 'Length']])}
  ${group('Ceiling', 'ceiling', F.ceiling, {ccSpacing: 'Carrying channel spacing (m)', stockLen: 'Channel / furring length (m)', wallAngleLen: 'Wall angle length (m)', hangerSpacing: 'Hanger spacing along channel (m)', hangerLen: 'Hanger length each (m)', screwsPerBoard: 'Screws per board', tapePerSqm: 'Joint tape (m/m²)', compoundPerSqm: 'Joint compound (kg/m²)', rivetsPerFurring: 'Rivets per furring row', acousticMainLen: 'Main runner length (m)', acousticMainSp: 'Main runner spacing (m)', acousticTile: 'Acoustic tile size (m)', acousticWallAngle: 'Acoustic wall angle length (m)', pvcWidth: 'PVC panel width (m)', pvcLength: 'PVC panel length (m)', pvcMoldingLen: 'PVC molding length (m)', pvcScrewsPerSqm: 'PVC screws per m²', woodFrameSp: 'Wood frame spacing (m)', bdftPerM: '2"x2" lumber (bd.ft per m)', nailsKgPerSqm: 'Nails (kg/m²)'})}
  ${group('Partition', 'partition', F.partition, {studLen: 'Stud length (m)', trackLen: 'Track length (m)', screwsPerBoard: 'Screws per board', tapePerSqm: 'Joint tape (m/m²)', compoundPerSqm: 'Joint compound (kg/m²)', anchorSp: 'Track anchor spacing (m)'})}
  ${group('Waste allowances (%)', 'waste', F.waste, {concrete: 'Concrete materials', chb: 'CHB (default)', board: 'Boards (default)', metal: 'Studs, tracks, channels, furring'})}`;
}

function vSelfTest() {
  const res = runSelfTests(), ok = res.filter(r => r.ok).length;
  return `<section class="card" id="selftest"><h2>Self-test: <span class="${ok === res.length ? 'pass' : 'fail'}" id="selftest-summary">${ok}/${res.length} passed</span></h2>
    <p class="muted">Worked examples calculated by hand and checked against the engine.</p>
    <table>${res.map(r => `<tr><td class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</td><td>${esc(r.name)}${r.fails.map(f => `<div class="err">${esc(f)}</div>`).join('')}</td></tr>`).join('')}</table></section>`;
}

render();
</script>
</body>
</html>
