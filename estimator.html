<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction Estimator</title>
<script>try { var t = localStorage.getItem('estimator.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --panel-2:#fbfaf7; --ink:#1b2230; --muted:#5c6676; --line:#e5e2da;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e8f0fc;
  --orange:#c45c00; --orange-soft:#fff1e3;
  --good:#1d8a4e; --good-soft:#e5f5ec; --warn:#9a6700; --warn-soft:#fff6dd; --bad:#c62828; --bad-soft:#fde8e8;
  --d-REBAR:#2a78d6; --d-CONC:#1baf7a; --d-FORM:#eda100; --d-MAS:#e34948; --d-PART:#6250d6; --d-CEIL:#e87ba4;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05); --radius:10px;
}
:root[data-theme="dark"]{
  --bg:#161b24; --panel:#1e2430; --panel-2:#232a37; --ink:#e8ecf2; --muted:#a3adbd; --line:#2f3747;
  --accent:#5b9cf5; --accent-ink:#0d1420; --accent-soft:#1f2c42;
  --orange:#ff9a3d; --orange-soft:#3a2a1a;
  --good:#5cc48a; --good-soft:#1c3327; --warn:#e6b450; --warn-soft:#33291a; --bad:#f2847c; --bad-soft:#3a2222;
  --d-REBAR:#3987e5; --d-CONC:#199e70; --d-FORM:#c98500; --d-MAS:#d63f4a; --d-PART:#9085e9; --d-CEIL:#d55181;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--d-CONC));display:grid;place-items:center;color:#fff;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);text-align:left;width:100%}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
.side-foot{margin-top:auto;padding:10px 8px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.top{position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 20px}
.top .title{min-width:0;flex:1 1 220px}
.top h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
main{padding:20px;max-width:1320px;width:100%;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.cta{background:var(--orange);color:#fff;border-color:var(--orange)}
:root[data-theme="dark"] .btn.cta{color:#1b1206}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.menu-btn{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 12px}
.card h3{font-size:12px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stack{display:grid;gap:16px}
.stack>*,.g-2>*,.g-kpi>*,.g-div>*,details.boqdiv{min-width:0}
.g-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.g-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.g-div{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kpi{position:relative;overflow:hidden;padding:14px 16px 14px 18px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--accent))}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent))}
.kpi .ico svg{width:16px;height:16px}
.kpi .val{font-size:24px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero .val{color:var(--orange)}
.divcard{border-top:4px solid var(--c);padding:14px 16px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.divcard:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.divcard .name{display:flex;align-items:center;gap:8px;font-weight:600}
.divcard .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.divcard .amt{font-size:20px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.divcard .meta{font-size:12px;color:var(--muted)}
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel-2);margin:10px 0 4px;gap:2px}
.split span{display:block;height:100%}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:10px;align-items:center;position:relative}
.bar-row .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:14px;background:var(--panel-2);border-radius:0 4px 4px 0;position:relative}
.fill{height:100%;border-radius:0 4px 4px 0;background:var(--c);min-width:2px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.bar-row .v small{color:var(--muted);margin-left:6px}
.bar-row:hover .tip,.bar-row:focus-within .tip{display:block}
.tip{display:none;position:absolute;z-index:3;left:160px;top:-38px;background:var(--ink);color:var(--panel);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;pointer-events:none}
.att{display:grid;gap:8px}
.att-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.sev{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap}
.sev.critical{background:var(--bad-soft);color:var(--bad)}
.sev.warning{background:var(--warn-soft);color:var(--warn)}
.sev.info{background:var(--accent-soft);color:var(--accent)}
.sev.ok{background:var(--good-soft);color:var(--good)}
.att-item .d{font-size:12px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qa .btn{justify-content:flex-start}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.fact{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fact .k{font-size:12px;color:var(--muted)}
.fact .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.fact .s{font-size:11.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f .u{font-size:11px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--panel-2);font-weight:600;white-space:nowrap;color:var(--muted);font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.lvl td{font-weight:600;color:var(--muted);background:var(--panel-2)}
tr.sub td{font-weight:650;border-top:1px solid var(--muted)}
tr.tot td{font-weight:750;font-size:15px}
tr.tot td.n{color:var(--orange)}
.muted{color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 11px;font-size:12.5px;margin:8px 0}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.tchip{display:inline-flex;align-items:center;gap:6px}
.tchip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.addgrp{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.secttl{grid-column:1/-1;font-size:12px;font-weight:650;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:3px;margin-top:6px}
details.boqdiv{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--radius);background:var(--panel);margin-bottom:12px;box-shadow:var(--shadow)}
details.boqdiv>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:650}
details.boqdiv>summary::-webkit-details-marker{display:none}
details.boqdiv>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.boqdiv[open]>summary::before{transform:rotate(90deg)}
details.boqdiv>summary .amt{margin-left:auto;font-variant-numeric:tabular-nums}
details.boqdiv .inner{padding:0 16px 14px}
.empty{text-align:center;padding:36px 16px}
.empty .big{width:64px;height:64px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.empty .big svg{width:32px;height:32px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg-h h2{font-size:15px;margin:0}
.dlg-b{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;overflow:auto;max-height:calc(100vh - 150px)}
.dlg-b.one{grid-template-columns:1fr}
.dlg-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.preview{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;align-self:start}
.preview h4{margin:8px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase}
.preview table{font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.kv b{font-weight:600}
.pass{color:var(--good);font-weight:600}.fail{color:var(--bad);font-weight:600}
.err{color:var(--bad);font-size:12px}
.print-only{display:none}
.scrim{display:none}
@media (max-width:1000px){.g-2{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,25,.35);z-index:15}
  .btn.menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  main{padding:16px}
}
@media (max-width:760px){.dlg-b{grid-template-columns:1fr}.bar-row{grid-template-columns:96px minmax(0,1fr) 110px}.tip{left:100px}.top .actions .lbl{display:none}}
@media (max-width:520px){.top .title{flex-basis:calc(100% - 60px)}.top .chips{order:3;width:100%}.top .actions{order:4}}
@media print{
  .side,.top,.noprint,.scrim{display:none!important}
  .shell{display:block}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card,details.boqdiv{box-shadow:none;border-color:#bbb}
  .print-only{display:block}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand"><span class="logo" aria-hidden="true">▦</span><span>Construction Estimator<small>Structural &amp; Architectural · PH</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" data-act="closeNav"></div>
  <div class="mainwrap">
    <header class="top">
      <button class="btn ghost menu-btn" data-act="openNav" aria-label="Open navigation">☰</button>
      <div class="title"><h1 id="projName"></h1><div class="sub" id="projSub"></div></div>
      <div class="row chips"><span id="revChip"></span><span id="saveStatus" role="status" aria-live="polite"></span></div>
      <div class="row actions">
        <button class="btn" data-act="toggleTheme" id="themeBtn" aria-label="Toggle light or dark theme"></button>
        <button class="btn" data-act="newProject">New</button>
        <button class="btn" data-act="openFile">Open…</button>
        <button class="btn pri" data-act="saveFile">Save file</button>
        <input type="file" id="fileIn" accept=".json,application/json" hidden>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<dialog id="dlg"></dialog>

<!-- ===================================================================== -->
<!-- ENGINE: pure calculation functions, no DOM access                     -->
<!-- ===================================================================== -->
<script id="engine">
'use strict';
const DIAS = [10, 12, 16, 20, 25, 28, 32, 36];
const EPS = 1e-9;
const ceilE = x => Math.ceil(x - EPS);
const floorE = x => Math.floor(x + EPS);
const round = (x, n = 3) => Math.round(x * 10 ** n) / 10 ** n;
const kgpm = d => d * d / 162;              // kg per metre of deformed bar, d in mm
const fmt = (x, d = 2) => Number(x || 0).toLocaleString('en-PH', {minimumFractionDigits: d, maximumFractionDigits: d});

const DIVS = [
  ['REBAR', 'Reinforcing Steel Works'],
  ['CONC', 'Concrete Works'],
  ['FORM', 'Formworks'],
  ['MAS', 'Masonry Works'],
  ['PART', 'Partition Works'],
  ['CEIL', 'Ceiling Works'],
];
const DIV_NAME = Object.fromEntries(DIVS);

// ---- Default factors (editable per project). Values marked VERIFY are
// common PH estimating figures (Fajardo-style); check against your references.
function defaultFactors() {
  return {
    rebar: {
      lapFactor: 40,          // lap splice = 40 x bar diameter
      tieHookD: 6,            // 135 deg seismic hook extension = 6d ...
      tieHookMin: 75,         // ... but not less than 75 mm
      hook90D: 12,            // 90 deg standard hook extension = 12d
      commercial: [6, 7.5, 9, 10.5, 12],
      tieWirePerX: 0.3,       // m of #16 GI wire per bar intersection
      tieWireMPerKg: 53,      // m of #16 GI wire per kg
      allowancePct: 0,        // extra allowance on purchased rebar weight
    },
    concrete: {               // per m3, 40 kg cement bags  (VERIFY)
      AA: {cement: 12.0, sand: 0.50, gravel: 1.00},
      A:  {cement: 9.0,  sand: 0.50, gravel: 1.00},
      B:  {cement: 7.5,  sand: 0.50, gravel: 1.00},
      C:  {cement: 6.0,  sand: 0.50, gravel: 1.00},
    },
    chb: {
      perSqm: 12.5,           // 10x20x40 / 12.5x20x40 / 15x20x40 blocks per m2
      courseH: 0.2,           // m per course
      mortar: {               // laying mortar per m2 of wall: cement bags by class, sand m3 (VERIFY)
        '4': {A: 0.792, B: 0.522, C: 0.394, sand: 0.0435},
        '5': {A: 1.150, B: 0.770, C: 0.580, sand: 0.0640},
        '6': {A: 1.526, B: 1.018, C: 0.763, sand: 0.0844},
      },
    },
    plaster: {A: 18.0, B: 12.0, C: 9.0, D: 7.5, sandPerCum: 1.0},   // cement bags per m3 of mortar (VERIFY)
    boards: {
      GYP9:  {w: 1.22, l: 2.44}, GYP12: {w: 1.22, l: 2.44}, MR12: {w: 1.22, l: 2.44},
      FC45:  {w: 1.22, l: 2.44}, FC6:   {w: 1.22, l: 2.44}, FC9:  {w: 1.22, l: 2.44},
      PLY6:  {w: 1.22, l: 2.44},
    },
    ceiling: {
      ccSpacing: 1.2, stockLen: 5.0, wallAngleLen: 3.0, hangerSpacing: 1.2, hangerLen: 0.6,
      screwsPerBoard: 30, tapePerSqm: 1.2, compoundPerSqm: 0.5, rivetsPerFurring: 2,
      acousticMainLen: 3.66, acousticMainSp: 1.22, acousticTile: 0.6, acousticWallAngle: 3.05,
      pvcWidth: 0.2, pvcLength: 5.95, pvcMoldingLen: 3.0, pvcScrewsPerSqm: 12,
      woodFrameSp: 0.6, bdftPerM: 1.094, nailsKgPerSqm: 0.1,   // 2"x2" lumber = 1.094 bd.ft per m
    },
    partition: {studLen: 3.0, trackLen: 3.0, screwsPerBoard: 30, tapePerSqm: 1.2, compoundPerSqm: 0.5, anchorSp: 0.6},
    waste: {concrete: 5, chb: 5, board: 5, metal: 5},
  };
}

// ---- Materials and labor catalog (order = BOQ order)
const MATERIALS = [
  ...DIAS.map(d => ['RB' + d, d + 'mm deformed bar', 'kg', 55]),
  ['TW', 'Tie wire #16 GI', 'kg', 95],
  ['CEM', 'Portland cement (40 kg)', 'bag', 260],
  ['SAND', 'Washed sand', 'm³', 1500],
  ['GRAV', 'Gravel 3/4"', 'm³', 1700],
  ['FORM', 'Formwork materials (plywood, lumber, nails)', 'm²', 380],
  ['CHB4', 'CHB 4" (10x20x40)', 'pc', 16],
  ['CHB5', 'CHB 5" (12.5x20x40)', 'pc', 19],
  ['CHB6', 'CHB 6" (15x20x40)', 'pc', 23],
  ['GYP9', 'Gypsum board 9mm 1.22x2.44', 'pc', 480],
  ['GYP12', 'Gypsum board 12mm 1.22x2.44', 'pc', 540],
  ['MR12', 'Moisture-resistant gypsum 12mm 1.22x2.44', 'pc', 780],
  ['FC45', 'Fiber cement board 4.5mm 1.22x2.44', 'pc', 420],
  ['FC6', 'Fiber cement board 6mm 1.22x2.44', 'pc', 540],
  ['FC9', 'Fiber cement board 9mm 1.22x2.44', 'pc', 880],
  ['PLY6', 'Marine plywood 1/4" 1.22x2.44', 'pc', 650],
  ['STUD', 'Metal stud 3.0m', 'pc', 190],
  ['TRK', 'Metal track 3.0m', 'pc', 150],
  ['ANC', 'Concrete anchor / nail', 'pc', 5],
  ['INS', 'Insulation (glasswool)', 'm²', 180],
  ['CC', 'Carrying channel 5.0m', 'pc', 210],
  ['MF', 'Metal furring 5.0m', 'pc', 170],
  ['WA', 'Wall angle 3.0m', 'pc', 85],
  ['HANG', 'Hanger wire / rod', 'm', 20],

// ---- Basic rebar helpers (lengths in m, diameters in mm)
const tieHook = (d, F) => Math.max(F.rebar.tieHookD * d, F.rebar.tieHookMin) / 1000;
const hook90 = (d, F) => F.rebar.hook90D * d / 1000;
const lapLen = (d, F) => F.rebar.lapFactor * d / 1000;
const countAcross = (width, sp) => (width > 0 && sp > 0) ? floorE(width / sp) + 1 : 0;   // bars spread across a width
function countZoned(H, s, Lo, sLo) {         // ties/stirrups with optional closer spacing over Lo at each end
  if (!(H > 0 && s > 0)) return 0;
  if (Lo > 0 && sLo > 0 && 2 * Lo < H) return 2 * ceilE(Lo / sLo) + ceilE((H - 2 * Lo) / s) + 1;
  return ceilE(H / s) + 1;
}

// Split a bar longer than the stock length into lapped pieces
function splitPiece(len, stock, lap) {
  const out = [];
  if (stock <= lap) return null;
  while (len > stock + EPS) { out.push(stock); len = len - stock + lap; }
  out.push(len);
  return out;
}
// First-fit decreasing, grouping identical lengths. pieces: Map len -> count
function ffdBars(pieces, stock) {
  const lens = [...pieces.keys()].sort((a, b) => b - a);
  const bins = [];   // remaining length in each purchased bar
  for (const len of lens) {
    let c = pieces.get(len);
    for (let i = 0; i < bins.length && c > 0; i++) {
      const fit = Math.min(c, floorE(bins[i] / len));
      if (fit > 0) { bins[i] = round(bins[i] - fit * len, 4); c -= fit; }
    }
    const per = floorE(stock / len);
    while (c > 0) { const k = Math.min(c, per); bins.push(round(stock - k * len, 4)); c -= k; }
  }
  return bins.length;
}
// Choose the commercial length that needs the least purchased steel for one diameter
function optimizeDia(pieceList, dia, F, stockSetting) {
  const lap = lapLen(dia, F);
  const cands = stockSetting === 'auto' ? F.rebar.commercial : [Number(stockSetting)];
  let net = 0;
  for (const p of pieceList) net += p.len * p.n;
  let best = null;
  for (const L of cands) {
    const pieces = new Map(); let splices = 0, ok = true;
    for (const p of pieceList) {
      const segs = splitPiece(p.len, L, lap);
      if (!segs) { ok = false; break; }
      splices += (segs.length - 1) * p.n;
      for (const s of segs) { const k = round(s, 3); pieces.set(k, (pieces.get(k) || 0) + p.n); }
    }
    if (!ok) continue;
    const bars = ffdBars(pieces, L), purchased = bars * L;
    if (!best || purchased < best.purchased - 1e-6 || (Math.abs(purchased - best.purchased) < 1e-6 && bars < best.bars))
      best = {stock: L, bars, purchased, splices};
  }
  if (!best) return null;
  best.dia = dia; best.net = net;
  best.netKg = net * kgpm(dia);
  best.kg = best.purchased * kgpm(dia) * (1 + F.rebar.allowancePct / 100);
  best.wastePct = best.purchased > 0 ? (best.purchased - net) / best.purchased * 100 : 0;
  return best;
}

// ---- Shared element pieces
function newOut() { return {bars: [], lines: [], labor: [], x: 0, info: []}; }
function bar(o, dia, len, n, desc, div = 'REBAR') {
  n = Math.round(n);
  if (n > 0 && len > 0 && dia > 0) o.bars.push({dia: +dia, len: round(len, 3), n, desc, div});
}
function concreteOut(o, vol, cls, F) {
  if (!(vol > 0)) return;
  const c = F.concrete[cls] || F.concrete.A, v = vol * (1 + F.waste.concrete / 100);
  o.lines.push({div: 'CONC', code: 'CEM', qty: v * c.cement}, {div: 'CONC', code: 'SAND', qty: v * c.sand}, {div: 'CONC', code: 'GRAV', qty: v * c.gravel});
  o.labor.push({div: 'CONC', code: 'L_CONC', qty: vol});
  o.info.push(['Concrete', fmt(vol, 3) + ' m³ (class ' + cls + ')']);
}
function formOut(o, area) {
  if (!(area > 0)) return;
  o.lines.push({div: 'FORM', code: 'FORM', qty: area});
  o.labor.push({div: 'FORM', code: 'L_FORM', qty: area});
  o.info.push(['Formwork', fmt(area) + ' m²']);
}
function parseOpenings(text) {
  const res = {area: 0, count: 0, list: [], errors: []};
  String(text || '').split(/[,;\n]+/).map(s => s.trim()).filter(Boolean).forEach(s => {
    const m = s.match(/^([\d.]+)\s*[x×*]\s*([\d.]+)(?:\s*[x×*]\s*(\d+))?$/i);
    if (!m) { res.errors.push(s); return; }
    const w = +m[1], h = +m[2], n = m[3] ? +m[3] : 1;
    res.area += w * h * n; res.count += n; res.list.push({w, h, n});
  });
  return res;
}

// ---- Derived numbers for the dashboard (all from buildBOQ / buildEstimate)

// Deterministic checks shown in "Needs attention" (the full rule engine is Phase 2)
function attention(dd) {
  const out = [], A = (sev, title, detail, act, actLabel) => out.push({sev, title, detail, act, actLabel});
  if (store.ok === false) A('critical', 'Changes are not being saved in this browser', store.error, 'saveFile', 'Save file');
  for (const r of store.report.filter(r => r.level === 'critical')) A('critical', 'Saved data could not be read', r.message, 'tab:project', 'Backups');
  if (dd.missingRebar.length) A('critical', 'Rebar missing from the BOQ', `No commercial length is longer than the lap for: ${dd.missingRebar.join(', ')}. Use a longer bar length or check the lap factor.`, 'tab:project', 'Settings');
  if (S.quarantine.elements.length) A('warning', `${S.quarantine.elements.length} element(s) kept in quarantine`, 'Unknown or invalid elements from a loaded file are kept but not costed.', 'tab:project', 'Review');
  const warns = store.report.filter(r => r.level === 'warn');
  if (warns.length) A('warning', `${warns.length} issue(s) found when loading the project`, warns.slice(0, 2).map(r => r.message).join(' '), 'tab:project', 'Details');
  const used = new Set(dd.b.rows.filter(r => r.kind === 'mat').map(r => r.code));
  const sample = [...used].filter(c => S.prices[c].source === 'sample');
  if (sample.length) A('warning', `${sample.length} of ${used.size} priced materials use sample prices`, 'Enter your supplier prices before using the totals.', 'tab:prices', 'Prices');
  const usedLab = new Set(dd.b.rows.filter(r => r.kind === 'lab').map(r => r.code));
  const sampleLab = [...usedLab].filter(c => S.labor[c].source === 'sample');
  if (sampleLab.length) A('warning', `${sampleLab.length} labor rate(s) are sample values`, 'Enter your own labor rates.', 'tab:prices', 'Labor');
  const fm = Object.values(S.factorMeta), unv = fm.filter(m => !m.verified).length;
  if (unv) A('warning', `${unv} of ${fm.length} estimating factors are not verified`, `Concrete, mortar and plaster factors are designated as ${SRC_FAJARDO}; record the table/page and tick Verified.`, 'tab:factors', 'Factors');
  const empty = S.elements.filter(e => { const r = computeElement(e, S.factors); return !r.lines.length && !r.bars.length; });
  if (empty.length) A('warning', `${empty.length} element(s) produce no quantities`, 'Check dimensions of ' + empty.slice(0, 6).map(e => e.mark).join(', ') + '.', 'tab:elements', 'Elements');
  const zero = S.elements.filter(e => !(Number(e.qty) > 0));
  if (zero.length) A('warning', `${zero.length} element(s) have quantity 0`, zero.slice(0, 6).map(e => e.mark).join(', ') + ' are not costed.', 'tab:elements', 'Elements');
  if ((S.meta.changesSinceFile || 0) > 0) A('info', `${S.meta.changesSinceFile} change(s) not yet saved to a project file`, S.meta.fileSavedAt ? `Last file save ${new Date(S.meta.fileSavedAt).toLocaleString('en-PH')}.` : 'This project has never been saved to a file.', 'saveFile', 'Save file');
  return out;
}

function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, arg = t.dataset.arg;
  if (act.startsWith('tab:')) return App.tab(act.slice(4));
  const ACT = {
    ...App,
    addElBtn: () => App.addEl(arg), edit: () => App.editEl(arg), copy: () => App.copyEl(arg), del: () => App.delEl(arg),
    lvUp: () => App.moveLevel(arg, -1), lvDown: () => App.moveLevel(arg, 1), lvDel: () => App.delLevel(arg),
    bkRestore: () => App.restoreBackup(arg), bkDownload: () => App.downloadBackup(arg), bkDelete: () => App.deleteBackup(arg),

// data-bind="<kind>:<key>[:<field>]" writes typed values into known places only
document.addEventListener('change', ev => {
  const t = ev.target.closest('[data-bind]'); if (!t) return;
  const [kind, key, field] = t.dataset.bind.split(':');
  const num = () => { const v = Number(t.value); return Number.isFinite(v) ? v : 0; };
  const today = localDate();
  if (kind === 'project' && hasOwn(S.project, key)) S.project[key] = t.value;
  else if (kind === 'setting' && hasOwn(S.settings, key)) S.settings[key] = key === 'stock' ? t.value : num();
  else if (kind === 'level') { const l = S.levels.find(x => x.id === key); if (!l) return; if (field === 'name') l.name = t.value; else if (field === 'h') l.h = num(); }
  else if (kind === 'price' && hasOwn(S.prices, key)) { const p = S.prices[key]; if (field === 'name') p.name = t.value; else if (field === 'price') p.price = num(); p.source = 'user'; p.updatedAt = today; }
  else if (kind === 'labor' && hasOwn(S.labor, key)) { const l = S.labor[key]; if (field === 'name') l.name = t.value; else if (field === 'mode') l.mode = t.value === 'pct' ? 'pct' : 'unit'; else if (field === 'rate') l.rate = num(); l.source = 'user'; l.updatedAt = today; }
  else if (kind === 'factor' && hasOwn(S.factorMeta, key)) {
    const ks = key.split('.'), last = ks.pop(), o = ks.reduce((a, k) => a[k], S.factors), m = S.factorMeta[key];
    if (field === 'value') {
      if (Array.isArray(o[last])) { const arr = t.value.split(/[ ,;]+/).map(Number).filter(x => x > 0).sort((a, b) => a - b); o[last] = arr.length ? arr : [6]; }
      else o[last] = num();
      m.verified = false; m.note = (m.note ? m.note + ' ' : '') + `Value changed by user on ${today}.`;
    } else if (field === 'ref') m.ref = t.value;
    else if (field === 'verified') m.verified = t.checked;
  } else return;
  persist(); render();
});

// ---- Elements
function vElements() {
  const cats = {};
  for (const [k, t] of Object.entries(TYPES)) (cats[t.cat] = cats[t.cat] || []).push([k, t]);
  const list = S.elements.filter(e => (levelFilter === 'all' || e.level === levelFilter) && (typeFilter === 'all' || e.type === typeFilter));
  const lvName = id => (S.levels.find(l => l.id === id) || {}).name || '?';
  const rows = list.map(e => {
    let r; try { r = computeElement(e, S.factors); } catch (err) { r = {info: [['Error', err.message]], lines: [], bars: []}; }
    const key = r.info.slice(0, 3).map(([a, b]) => `<span class="muted">${esc(a)}:</span> ${esc(b)}`).join(' · ');
    const none = !r.lines.length && !r.bars.length;

// ---- Element editor
function openEditor(el) {
  draft = el;
  const t = TYPES[el.type], dlg = document.getElementById('dlg');
  const fieldsHtml = t.fields.map(f => {
    if (f.sec) return `<div class="secttl">${esc(f.sec)}</div>`;
    const v = el.inp[f.k], id = 'f_' + f.k;
    if (f.t === 'chk') return `<label class="chk" style="grid-column:1/-1"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
    if (f.t === 'sel') return field(f.label, `<select id="${id}">${f.opts.map(([ov, on]) => `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(on)}</option>`).join('')}</select>`);
    if (f.t === 'txt') return `<div style="grid-column:1/-1">${field(f.label, `<input id="${id}" value="${esc(v)}" placeholder="${esc(f.ph || '')}">`)}</div>`;
    return field(f.label, `<input id="${id}" type="number" step="${esc(f.step)}" value="${esc(v)}">`, f.unit);
  }).join('');
  dlg.setAttribute('aria-labelledby', 'dlgTitle');
  dlg.innerHTML = `
    <div class="dlg-h"><h2 id="dlgTitle">${el.id ? 'Edit' : 'New'} ${esc(t.name)}</h2><button class="btn sm" data-act="closeEditor" aria-label="Close">✕</button></div>
    <div class="dlg-b">
      <div>
        <div class="grid">
          ${field('Mark', `<input id="e_mark" value="${esc(el.mark)}">`)}
          ${field('Level', `<select id="e_level">${S.levels.map(l => `<option value="${esc(l.id)}" ${l.id === el.level ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>`)}
          ${field('Quantity (same elements)', `<input id="e_qty" type="number" step="1" min="0" value="${esc(el.qty)}">`, 'pcs')}
        </div>
        <div class="grid" style="margin-top:6px">${fieldsHtml}</div>
      </div>
      <div class="preview" id="pv"></div>
    </div>
    <div class="dlg-f"><button class="btn" data-act="closeEditor">Cancel</button><button class="btn pri" data-act="saveEditor">Save element</button></div>`;
  dlg.oninput = dlg.onchange = () => { readEditor(); preview(); };
  preview();
  if (!dlg.open) dlg.showModal();
}
function readEditor() {
  const t = TYPES[draft.type], g = id => document.getElementById(id);
  draft.mark = g('e_mark').value.trim() || draft.mark; draft.level = g('e_level').value; draft.qty = Math.max(0, Math.round(Number(g('e_qty').value) || 0));
  for (const f of t.fields) {
    if (!f.k) continue; const n = g('f_' + f.k);
    draft.inp[f.k] = f.t === 'chk' ? n.checked : f.t === 'num' ? Number(n.value) : (typeof f.def === 'number' ? Number(n.value) : n.value);
  }
}
function preview() {
  const pv = document.getElementById('pv');
  let r;
  try { r = computeElement(draft, S.factors); } catch (e) { pv.innerHTML = `<p class="err">Check inputs: ${esc(e.message)}</p>`; return; }
  const q = draft.qty, P = S.prices, agg = new Map();
  for (const l of r.lines) agg.set(l.code, (agg.get(l.code) || 0) + l.qty);
  pv.innerHTML = `
    <div class="kv">${r.info.map(([a, b]) => `<span class="muted">${esc(a)}</span><b>${esc(b)}</b>`).join('')}</div>
    ${!r.lines.length && !r.bars.length ? '<p class="note">These inputs produce no quantities. Check dimensions, spacing and cover.</p>' : ''}
    ${r.bars.length ? `<h4>Bar list (1 element)</h4><table><tr><th>Bar</th><th class="n">Ø</th><th class="n">Cut L (m)</th><th class="n">No.</th><th class="n">kg</th></tr>
      ${r.bars.map(b => `<tr><td>${esc(b.desc)}</td><td class="n">${b.dia}</td><td class="n">${fmt(b.len, 3)}</td><td class="n">${b.n}</td><td class="n">${fmt(b.len * b.n * kgpm(b.dia))}</td></tr>`).join('')}</table>` : ''}
    ${agg.size ? `<h4>Materials (× ${q} element${q === 1 ? '' : 's'}, before rounding)</h4><table>${[...agg].map(([c, v]) => `<tr><td>${esc(P[c].name)}</td><td class="n">${fmt(v * q, 3)}</td><td>${esc(P[c].unit)}</td></tr>`).join('')}</table>` : ''}
    ${r.bars.length ? `<p class="muted" style="font-size:12px">Rebar purchase (commercial lengths, laps, tie wire) is optimized per level on the Rebar schedule tab.</p>` : ''}`;
}
function saveEditor() {
  readEditor();
  if (draft.id) { const i = S.elements.findIndex(e => e.id === draft.id); if (i >= 0) S.elements[i] = draft; }
  else { draft.id = uid(); S.elements.push(draft); }
  persist(); closeEditor(); render();
}
function closeEditor() { document.getElementById('dlg').close(); draft = null; }

// ---- Rebar schedule
function vRebar() {
  const est = buildEstimate(S), F = S.factors, proj = new Map();
  let html = `<div class="card"><h2>Rebar schedule</h2><p class="muted" style="margin:0">Cut lengths include hooks and laps. Bars longer than the commercial length are spliced with a lap of ${esc(F.rebar.lapFactor)}d. Purchase quantities are optimized per level and work division.</p></div>`;
  for (const {level, divs} of est) {
    const withBars = S.elements.filter(e => e.level === level.id).map(e => ({e, r: computeElement(e, F)})).filter(x => x.r.bars.length);
    if (!withBars.length) continue;
    const xs = Object.values(divs).reduce((s, d) => s + d.x, 0);
    html += `<div class="card"><h2>${esc(level.name)}</h2><div class="tbl-wrap"><table>
      <tr><th>Mark</th><th>Bar</th><th class="n">Ø mm</th><th class="n">Cut length (m)</th><th class="n">No. / element</th><th class="n">Elements</th><th class="n">Total length (m)</th><th class="n">Weight (kg)</th></tr>
      ${withBars.map(({e, r}) => r.bars.map((b, i) => `<tr><td>${i ? '' : '<b>' + esc(e.mark) + '</b>'}</td><td>${esc(b.desc)}</td><td class="n">${b.dia}</td><td class="n">${fmt(b.len, 3)}</td><td class="n">${b.n}</td><td class="n">${esc(e.qty)}</td><td class="n">${fmt(b.len * b.n * e.qty)}</td><td class="n">${fmt(b.len * b.n * e.qty * kgpm(b.dia))}</td></tr>`).join('')).join('')}
      </table></div>
      <h3>Purchase list</h3><div class="tbl-wrap"><table><tr><th>Division</th><th class="n">Ø mm</th><th class="n">Net length (m)</th><th class="n">Splices</th><th class="n">Commercial length</th><th class="n">Bars to buy</th><th class="n">Weight to buy (kg)</th><th class="n">Waste incl. laps</th></tr>
      ${Object.entries(divs).flatMap(([dk, d]) => [...d.bars.keys()].sort((a, b) => a - b).map(dia => {
        const o = d.rebar.find(x => x.dia === dia);
        if (!o) return `<tr><td>${esc(DIV_NAME[dk])}</td><td class="n">${dia}</td><td colspan="6"><span class="pill bad">✕ Not purchasable</span> No commercial length is longer than the ${fmt(lapLen(dia, F), 2)} m lap. This bar is missing from the BOQ.</td></tr>`;
        const k = o.dia + '|' + o.stock, p = proj.get(k) || {dia: o.dia, stock: o.stock, bars: 0, kg: 0}; p.bars += o.bars; p.kg += o.kg; proj.set(k, p);
        return `<tr><td><span class="tchip" style="--c:var(--d-${dk})">${esc(DIV_NAME[dk])}</span></td><td class="n">${o.dia}</td><td class="n">${fmt(o.net)}</td><td class="n">${o.splices}</td><td class="n">${o.stock} m</td><td class="n"><b>${o.bars}</b></td><td class="n">${fmt(o.kg)}</td><td class="n">${fmt(o.wastePct, 1)}%</td></tr>`;
      })).join('')}
      </table></div>
      ${xs ? `<p class="muted">Tie wire #16: ${fmt(xs * F.rebar.tieWirePerX / F.rebar.tieWireMPerKg)} kg (${xs} intersections × ${esc(F.rebar.tieWirePerX)} m ÷ ${esc(F.rebar.tieWireMPerKg)} m/kg)</p>` : ''}
    </div>`;
  }
  if (!proj.size) return `<div class="stack">${html}<div class="card empty"><div class="big">${icon('rebar')}</div><p class="muted">No reinforced elements yet.</p></div></div>`;
  const tot = [...proj.values()].sort((a, b) => a.dia - b.dia || a.stock - b.stock);
  html += `<div class="card"><h2>Project total – rebar to order</h2><div class="tbl-wrap"><table><tr><th class="n">Ø mm</th><th class="n">Length</th><th class="n">Pieces</th><th class="n">Weight (kg)</th></tr>
    ${tot.map(p => `<tr><td class="n">${p.dia}</td><td class="n">${p.stock} m</td><td class="n"><b>${p.bars}</b></td><td class="n">${fmt(p.kg)}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">Total</td><td class="n">${tot.reduce((s, p) => s + p.bars, 0)}</td><td class="n">${fmt(tot.reduce((s, p) => s + p.kg, 0))}</td></tr></table></div></div>`;
  return `<div class="stack">${html}</div>`;
}

  }).join('');
  const T = b.totals, s = S.settings;
  const sum = `

    ${b.divTotals.map(d => `<tr><td></td><td colspan="4">${esc(d.name)}</td><td class="n">${num(d.amt)}</td></tr>`).join('')}
    <tr class="sub"><td></td><td colspan="4">Total direct cost</td><td class="n">${num(T.direct)}</td></tr>

    <tr class="tot"><td></td><td colspan="4">TOTAL PROJECT COST</td><td class="n">${num(T.grand)}</td></tr>`;
  const head = `<tr><th class="n">Item</th><th>Description</th><th class="n">Qty</th><th>Unit</th><th class="n">Unit cost (₱)</th><th class="n">Amount (₱)</th></tr>`;
  const title = `<tr><td colspan="6"><b>BILL OF QUANTITIES – ${esc(p.name)}</b></td></tr><tr><td colspan="6">${esc([p.location, p.owner, p.date].filter(Boolean).join(' · '))}</td></tr>`;
  const table = `<table>${title}${head}${b.rows.length ? body : '<tr><td colspan="6">No elements yet.</td></tr>'}${b.rows.length ? sum : ''}</table>`;
  if (!forExcel) return table;
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><style>td,th{border:.5pt solid #ccc;font-family:Calibri}.div td{background:#dce6f5;font-weight:bold}.sub td,.tot td{font-weight:bold}.n{text-align:right}</style></head><body>${table}</body></html>`;
}
function boqCsv() {
  const b = buildBOQ(S), q = v => `"${String(v).replace(/"/g, '""')}"`, out = [['Item', 'Description', 'Qty', 'Unit', 'Unit cost', 'Amount']];
  let i = 0;
  for (const r of b.rows) {
    if (r.kind === 'div') { i = 0; out.push(['', r.text]); }
    else if (r.kind === 'lvl') out.push(['', r.text]);
    else if (r.kind === 'sub') out.push(['', r.text, '', '', '', round(r.amt, 2)]);
    else out.push([++i, r.name, r.qty, r.unit, r.pct ? 'of ' + round(r.rate, 2) : r.rate, round(r.amt, 2)]);
  }
  const T = b.totals;
  out.push([], ['', 'Total direct cost', '', '', '', round(T.direct, 2)], ['', 'OCM', '', '', '', round(T.ocm, 2)], ['', 'Profit', '', '', '', round(T.profit, 2)],
    ['', 'Contingency', '', '', '', round(T.cont, 2)], ['', 'VAT', '', '', '', round(T.vat, 2)], ['', 'TOTAL PROJECT COST', '', '', '', round(T.grand, 2)]);
  return out.map(r => r.map(q).join(',')).join('\r\n');
}

// ---- BOQ view (on screen: collapsible division cards)
function vBOQ() {

    if (r.kind === 'div') { g = {key: DIVS.find(([, n]) => n === r.text)[0], name: r.text, rows: []}; groups.push(g); }

      i++;
      return `<tr><td class="n">${i}</td><td>${esc(r.name)}</td><td class="n">${r.pct ? fmt(r.qty) : fmt(r.qty, r.kind === 'mat' && CEIL_UNITS.has(r.unit) ? 0 : 2)}</td><td>${esc(r.unit)}</td><td class="n">${r.pct ? 'of ' + fmt(r.rate) : fmt(r.rate)}</td><td class="n">${fmt(r.amt)}</td></tr>`;

    return `<details class="boqdiv" id="div-${gr.key}" style="--c:var(--d-${gr.key})" open><summary><span class="tchip" style="--c:var(--d-${gr.key})">${esc(gr.name)}</span><span class="pill">${(T.direct ? divAmt[gr.key] / T.direct * 100 : 0).toFixed(1)}%</span><span class="amt">${esc(peso(divAmt[gr.key]))}</span></summary>

    <tr><td>OCM (${esc(s.ocm)}%)</td><td class="n">${esc(fmt(T.ocm))}</td></tr>
    <tr><td>Contractor's profit (${esc(s.profit)}%)</td><td class="n">${esc(fmt(T.profit))}</td></tr>
    <tr><td>Contingency (${esc(s.contingency)}%)</td><td class="n">${esc(fmt(T.cont))}</td></tr>
    <tr class="sub"><td>Subtotal</td><td class="n">${esc(fmt(T.sub))}</td></tr>
    <tr><td>VAT (${esc(s.vat)}%)</td><td class="n">${esc(fmt(T.vat))}</td></tr>
    <tr class="tot"><td>TOTAL PROJECT COST</td><td class="n">${esc(peso(T.grand))}</td></tr></table></div></div>`;
  return `<div class="stack">
  <div class="card noprint"><div class="row between"><div><h2 style="margin:0">Bill of Quantities & Cost</h2><div class="muted" style="margin-top:4px">Total project cost <b style="color:var(--orange);font-size:18px">${esc(peso(T.grand))}</b> · Direct cost ${esc(peso(T.direct))}</div></div>
    <div class="row"><button class="btn" data-act="exportXls">Export Excel</button><button class="btn" data-act="exportCsv">Export CSV</button><button class="btn pri" data-act="print">Print / PDF</button></div></div>
    ${Object.values(S.prices).some(x => x.source === 'sample') ? `<div class="note">Some prices are sample placeholders. Update them on the <a href="#" data-act="tab:prices">Prices</a> tab before using this estimate.</div>` : ''}

  ${groups.length ? body + sum : `<div class="card empty"><div class="big">${icon('boq')}</div><p class="muted">No elements yet.</p></div>`}

// ---- Factors (with provenance)
const FACTOR_LABEL = {
  'rebar.lapFactor': 'Lap splice (× d)', 'rebar.tieHookD': 'Tie hook extension, 135° (× d)', 'rebar.tieHookMin': 'Tie hook minimum (mm)', 'rebar.hook90D': '90° hook extension (× d)',
  'rebar.commercial': 'Commercial lengths (m)', 'rebar.tieWirePerX': 'Tie wire per intersection (m)', 'rebar.tieWireMPerKg': '#16 tie wire length per kg (m/kg)', 'rebar.allowancePct': 'Extra allowance on rebar (%)',
  'chb.perSqm': 'CHB per m²', 'chb.courseH': 'Course height (m)', 'plaster.sandPerCum': 'Sand per m³ plaster mortar (m³)',
};
function factorLabel(p) {
  if (FACTOR_LABEL[p]) return FACTOR_LABEL[p];
  let m;
  if ((m = p.match(/^concrete\.(\w+)\.(\w+)$/))) return `Class ${m[1]} – ${m[2]} ${m[2] === 'cement' ? '(bags/m³)' : '(m³/m³)'}`;
  if ((m = p.match(/^chb\.mortar\.(\d)\.(\w+)$/))) return `${m[1]}" CHB mortar – ${m[2] === 'sand' ? 'sand (m³/m²)' : 'class ' + m[2] + ' cement (bags/m²)'}`;
  if ((m = p.match(/^plaster\.(\w)$/))) return `Plaster class ${m[1]} – cement (bags/m³)`;
  if ((m = p.match(/^boards\.(\w+)\.(\w)$/))) return `${m[1]} board ${m[2] === 'w' ? 'width' : 'length'} (m)`;
  if ((m = p.match(/^waste\.(\w+)$/))) return `Waste – ${m[1]} (%)`;
  return p.split('.').slice(1).join(' ').replace(/([A-Z])/g, ' $1').toLowerCase();
}
function vFactors() {
  const groups = [['rebar', 'Rebar'], ['concrete', 'Concrete mix per m³ (40 kg bags)'], ['chb', 'CHB and laying mortar per m² of wall'], ['plaster', 'Plaster mortar'], ['boards', 'Board sizes'], ['ceiling', 'Ceiling'], ['partition', 'Partition'], ['waste', 'Waste allowances']];
  const all = factorPaths(S.factors), fm = S.factorMeta, nv = Object.values(fm).filter(m => m.verified).length;
  return `<div class="stack">
  <div class="card"><div class="row between"><h2 style="margin:0">Estimating factors</h2><button class="btn sm" data-act="resetFactors">Reset to defaults</button></div>
    <p class="muted">These factors are saved with this project; changing one updates every element. <b>${nv} of ${all.length}</b> are verified.</p>
    <div class="note">Concrete, mortar and plaster factors are designated as <b>${esc(SRC_FAJARDO)}</b>. The values have not been checked against the book. Enter the table and page you checked, then tick <b>Verified</b>. The 5" CHB mortar row is interpolated and has no cited source.</div></div>
  ${groups.map(([g, title]) => `<div class="card"><h2>${esc(title)}</h2><div class="tbl-wrap"><table>
    <tr><th>Factor</th><th class="n">Value</th><th>Source</th><th>Table / page checked</th><th>Verified</th></tr>
    ${all.filter(([p]) => p.split('.')[0] === g).map(([p, v]) => { const m = fm[p] || {source: '', ref: '', verified: false, note: ''}; return `<tr>
      <td>${esc(factorLabel(p))}</td>
      <td class="n">${Array.isArray(v) ? inputB(`factor:${p}:value`, v.join(', '), 'text', 'style="max-width:160px"') : inputB(`factor:${p}:value`, v, 'number', 'style="max-width:110px;text-align:right"')}</td>
      <td style="max-width:320px">${esc(m.source)}${m.note ? `<div class="muted" style="font-size:11.5px">${esc(m.note)}</div>` : ''}</td>
      <td>${inputB(`factor:${p}:ref`, m.ref, 'text', 'placeholder="e.g. Table 2-3, p. 41"')}</td>
      <td><label class="chk"><input type="checkbox" data-bind="factor:${esc(p)}:verified" ${m.verified ? 'checked' : ''}> <span class="pill ${m.verified ? 'good' : /interpolated/i.test(m.source) ? 'bad' : 'warn'}">${m.verified ? 'Verified' : /interpolated/i.test(m.source) ? 'Interpolated' : 'Unverified'}</span></label></td></tr>`; }).join('')}
  </table></div></div>`).join('')}
  </div>`;
}

function vSelfTest() {
  const res = runSelfTests(), ok = res.filter(r => r.ok).length;
  return `<div class="card" id="selftest"><h2>Self-test: <span class="${ok === res.length ? 'pass' : 'fail'}" id="selftest-summary">${ok}/${res.length} passed</span></h2>
    <p class="muted">Worked examples calculated by hand and checked against the engine (engine ${esc(ENGINE_VERSION)}).</p>
    <table>${res.map(r => `<tr><td class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</td><td>${esc(r.name)}${r.fails.map(f => `<div class="err">${esc(f)}</div>`).join('')}</td></tr>`).join('')}</table></div>`;
}

render();
</script>
</body>
</html>
