<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction Estimator</title>
<script>try { var t = localStorage.getItem('estimator.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --panel-2:#fbfaf7; --ink:#1b2230; --muted:#5c6676; --line:#e5e2da;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#e8f0fc;
  --orange:#c45c00; --orange-soft:#fff1e3;
  --good:#1d8a4e; --good-soft:#e5f5ec; --warn:#9a6700; --warn-soft:#fff6dd; --bad:#c62828; --bad-soft:#fde8e8;
  --d-REBAR:#2a78d6; --d-CONC:#1baf7a; --d-FORM:#eda100; --d-MAS:#e34948; --d-PART:#6250d6; --d-CEIL:#e87ba4; --d-OTHER:#6b7686;
  --d-EARTH:var(--d-OTHER); --d-ROOF:var(--d-OTHER); --d-TILE:var(--d-OTHER); --d-WP:var(--d-OTHER); --d-PAINT:var(--d-OTHER); --d-DW:var(--d-OTHER); --d-STEEL:var(--d-OTHER); --d-PLUMB:var(--d-OTHER); --d-ELEC:var(--d-OTHER);
  --shadow:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05); --radius:10px;
}
:root[data-theme="dark"]{
  --bg:#161b24; --panel:#1e2430; --panel-2:#232a37; --ink:#e8ecf2; --muted:#a3adbd; --line:#2f3747;
  --accent:#5b9cf5; --accent-ink:#0d1420; --accent-soft:#1f2c42;
  --orange:#ff9a3d; --orange-soft:#3a2a1a;
  --good:#5cc48a; --good-soft:#1c3327; --warn:#e6b450; --warn-soft:#33291a; --bad:#f2847c; --bad-soft:#3a2222;
  --d-REBAR:#3987e5; --d-CONC:#199e70; --d-FORM:#c98500; --d-MAS:#d63f4a; --d-PART:#9085e9; --d-CEIL:#d55181; --d-OTHER:#8b95a5;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--d-CONC));display:grid;place-items:center;color:#fff;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);text-align:left;width:100%}
.nav button:hover{background:var(--panel-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted)}
.side-foot{margin-top:auto;padding:10px 8px 0;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.top{position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 20px}
.top .title{min-width:0;flex:1 1 220px}
.top h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
main{padding:20px;max-width:1320px;width:100%;margin:0 auto}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.cta{background:var(--orange);color:#fff;border-color:var(--orange)}
:root[data-theme="dark"] .btn.cta{color:#1b1206}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.menu-btn{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 12px}
.card h3{font-size:12px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stack{display:grid;gap:16px}
.stack>*,.g-2>*,.g-kpi>*,.g-div>*,details.boqdiv{min-width:0}
.g-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.g-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.g-div{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kpi{position:relative;overflow:hidden;padding:14px 16px 14px 18px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--accent))}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 15%,transparent);color:var(--c,var(--accent))}
.kpi .ico svg{width:16px;height:16px}
.kpi .val{font-size:24px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero .val{color:var(--orange)}
.divcard{border-top:4px solid var(--c);padding:14px 16px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.divcard:hover{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.divcard .name{display:flex;align-items:center;gap:8px;font-weight:600}
.divcard .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.divcard .amt{font-size:20px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.divcard .meta{font-size:12px;color:var(--muted)}
.split{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--panel-2);margin:10px 0 4px;gap:2px}
.split span{display:block;height:100%}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:10px;align-items:center;position:relative}
.bar-row .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:14px;background:var(--panel-2);border-radius:0 4px 4px 0;position:relative}
.fill{height:100%;border-radius:0 4px 4px 0;background:var(--c);min-width:2px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.bar-row .v small{color:var(--muted);margin-left:6px}
.bar-row:hover .tip,.bar-row:focus-within .tip{display:block}
.tip{display:none;position:absolute;z-index:3;left:160px;top:-38px;background:var(--ink);color:var(--panel);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;pointer-events:none}
.att{display:grid;gap:8px}
.att-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.sev{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;white-space:nowrap}
.sev.critical{background:var(--bad-soft);color:var(--bad)}
.sev.warning{background:var(--warn-soft);color:var(--warn)}
.sev.info{background:var(--accent-soft);color:var(--accent)}
.sev.ok{background:var(--good-soft);color:var(--good)}
.att-item .d{font-size:12px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qa .btn{justify-content:flex-start}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.fact{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fact .k{font-size:12px;color:var(--muted)}
.fact .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.fact .s{font-size:11.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f .u{font-size:11px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--panel-2);font-weight:600;white-space:nowrap;color:var(--muted);font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.lvl td{font-weight:600;color:var(--muted);background:var(--panel-2)}
tr.sub td{font-weight:650;border-top:1px solid var(--muted)}
tr.tot td{font-weight:750;font-size:15px}
tr.tot td.n{color:var(--orange)}
.muted{color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 11px;font-size:12.5px;margin:8px 0}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.tchip{display:inline-flex;align-items:center;gap:6px}
.tchip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.addgrp{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.secttl{grid-column:1/-1;font-size:12px;font-weight:650;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:3px;margin-top:6px}
details.boqdiv{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--radius);background:var(--panel);margin-bottom:12px;box-shadow:var(--shadow)}
details.boqdiv>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:650}
details.boqdiv>summary::-webkit-details-marker{display:none}
details.boqdiv>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.boqdiv[open]>summary::before{transform:rotate(90deg)}
details.boqdiv>summary .amt{margin-left:auto;font-variant-numeric:tabular-nums}
details.boqdiv .inner{padding:0 16px 14px}
.empty{text-align:center;padding:36px 16px}
.empty .big{width:64px;height:64px;margin:0 auto 10px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.empty .big svg{width:32px;height:32px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg-h h2{font-size:15px;margin:0}
.dlg-b{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;overflow:auto;max-height:calc(100vh - 150px)}
.dlg-b.one{grid-template-columns:1fr}
.dlg-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.preview{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;align-self:start}
.preview h4{margin:8px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase}
.preview table{font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.kv b{font-weight:600}
.pass{color:var(--good);font-weight:600}.fail{color:var(--bad);font-weight:600}
.err{color:var(--bad);font-size:12px}
.sev.major{background:var(--orange-soft);color:var(--orange)}
.sev.minor{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.sevcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sevcard{border-left:5px solid var(--c);padding:12px 14px}
.sevcard .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.sevcard .s{font-size:12px;color:var(--muted)}
.find{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
.find .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.find .id{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
.find .ev{font-size:11.5px;color:var(--muted);margin-top:6px;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;background:var(--panel-2);border-radius:6px;padding:6px 8px}
.find .sg{font-size:12.5px;margin-top:6px}
.find .hist{font-size:12px;color:var(--muted);margin-top:6px}
.checks{display:grid;gap:4px;margin-bottom:8px}
.checks div{font-size:12px;display:flex;gap:6px;align-items:flex-start}
.wm-banner{display:none;border:2px solid #c62828;color:#c62828;padding:6px 10px;font-weight:700;margin:0 0 8px}
.ok-banner{display:none;border:2px solid #1d8a4e;color:#1d8a4e;padding:6px 10px;font-weight:700;margin:0 0 8px}
.print-only{display:none}
.scrim{display:none}
@media (max-width:1000px){.g-2{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,25,.35);z-index:15}
  .btn.menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  main{padding:16px}
}
@media (max-width:760px){.dlg-b{grid-template-columns:1fr}.bar-row{grid-template-columns:96px minmax(0,1fr) 110px}.tip{left:100px}.top .actions .lbl{display:none}}
@media (max-width:520px){.top .title{flex-basis:calc(100% - 60px)}.top .chips{order:3;width:100%}.top .actions{order:4}}
@media print{
  .side,.top,.noprint,.scrim{display:none!important}
  .shell{display:block}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card,details.boqdiv{box-shadow:none;border-color:#bbb}
  .print-only{display:block}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wm-banner:not(:empty),.ok-banner:not(:empty){display:block}
  body[data-watermark]::after{content:attr(data-watermark);position:fixed;top:42%;left:-20%;right:-20%;text-align:center;transform:rotate(-28deg);font-size:40px;font-weight:800;color:rgba(198,40,40,.18);z-index:100;pointer-events:none}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand"><span class="logo" aria-hidden="true">▦</span><span>Construction Estimator<small>Structural &amp; Architectural · PH</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" data-act="closeNav"></div>
  <div class="mainwrap">
    <header class="top">
      <button class="btn ghost menu-btn" data-act="openNav" aria-label="Open navigation">☰</button>
      <div class="title"><h1 id="projName"></h1><div class="sub" id="projSub"></div></div>
      <div class="row chips"><span id="revChip"></span><span id="saveStatus" role="status" aria-live="polite"></span></div>
      <div class="row actions">
        <button class="btn" data-act="toggleTheme" id="themeBtn" aria-label="Toggle light or dark theme"></button>
        <button class="btn" data-act="newProject">New</button>
        <button class="btn" data-act="openFile">Open…</button>
        <button class="btn pri" data-act="saveFile">Save file</button>
        <input type="file" id="fileIn" accept=".json,application/json" hidden>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<dialog id="dlg"></dialog>

<!-- ===================================================================== -->
<!-- ENGINE: pure calculation functions, no DOM access                     -->
<!-- ===================================================================== -->
<script id="engine">
'use strict';
const DIAS = [10, 12, 16, 20, 25, 28, 32, 36];
const EPS = 1e-9;
const ceilE = x => Math.ceil(x - EPS);
const floorE = x => Math.floor(x + EPS);
const round = (x, n = 3) => Math.round(x * 10 ** n) / 10 ** n;
const kgpm = d => d * d / 162;              // kg per metre of deformed bar, d in mm
const fmt = (x, d = 2) => Number(x || 0).toLocaleString('en-PH', {minimumFractionDigits: d, maximumFractionDigits: d});

const DIVS = [
  ['REBAR', 'Reinforcing Steel Works'],
  ['CONC', 'Concrete Works'],
  ['FORM', 'Formworks'],
  ['MAS', 'Masonry Works'],
  ['PART', 'Partition Works'],
  ['CEIL', 'Ceiling Works'],
];
const DIV_NAME = Object.fromEntries(DIVS);

// ---- Default factors (editable per project). Values marked VERIFY are
// common PH estimating figures (Fajardo-style); check against your references.
function defaultFactors() {
  return {
    rebar: {
      lapFactor: 40,          // lap splice = 40 x bar diameter
      tieHookD: 6,            // 135 deg seismic hook extension = 6d ...
      tieHookMin: 75,         // ... but not less than 75 mm
      hook90D: 12,            // 90 deg standard hook extension = 12d
      commercial: [6, 7.5, 9, 10.5, 12],
      tieWirePerX: 0.3,       // m of #16 GI wire per bar intersection
      tieWireMPerKg: 53,      // m of #16 GI wire per kg
      allowancePct: 0,        // extra allowance on purchased rebar weight
    },
    concrete: {               // per m3, 40 kg cement bags  (VERIFY)
      AA: {cement: 12.0, sand: 0.50, gravel: 1.00},
      A:  {cement: 9.0,  sand: 0.50, gravel: 1.00},
      B:  {cement: 7.5,  sand: 0.50, gravel: 1.00},
      C:  {cement: 6.0,  sand: 0.50, gravel: 1.00},
    },
    chb: {
      perSqm: 12.5,           // 10x20x40 / 12.5x20x40 / 15x20x40 blocks per m2
      courseH: 0.2,           // m per course
      mortar: {               // laying mortar per m2 of wall: cement bags by class, sand m3 (VERIFY)
        '4': {A: 0.792, B: 0.522, C: 0.394, sand: 0.0435},
        '5': {A: 1.150, B: 0.770, C: 0.580, sand: 0.0640},
        '6': {A: 1.526, B: 1.018, C: 0.763, sand: 0.0844},
      },
    },
    plaster: {A: 18.0, B: 12.0, C: 9.0, D: 7.5, sandPerCum: 1.0},   // cement bags per m3 of mortar (VERIFY)
    boards: {
      GYP9:  {w: 1.22, l: 2.44}, GYP12: {w: 1.22, l: 2.44}, MR12: {w: 1.22, l: 2.44},
      FC45:  {w: 1.22, l: 2.44}, FC6:   {w: 1.22, l: 2.44}, FC9:  {w: 1.22, l: 2.44},
      PLY6:  {w: 1.22, l: 2.44},
    },
    ceiling: {
      ccSpacing: 1.2, stockLen: 5.0, wallAngleLen: 3.0, hangerSpacing: 1.2, hangerLen: 0.6,

// ---- Basic rebar helpers (lengths in m, diameters in mm)
const tieHook = (d, F) => Math.max(F.rebar.tieHookD * d, F.rebar.tieHookMin) / 1000;
const hook90 = (d, F) => F.rebar.hook90D * d / 1000;
const lapLen = (d, F) => F.rebar.lapFactor * d / 1000;
const countAcross = (width, sp) => (width > 0 && sp > 0) ? floorE(width / sp) + 1 : 0;   // bars spread across a width
function countZoned(H, s, Lo, sLo) {         // ties/stirrups with optional closer spacing over Lo at each end
  if (!(H > 0 && s > 0)) return 0;
  if (Lo > 0 && sLo > 0 && 2 * Lo < H) return 2 * ceilE(Lo / sLo) + ceilE((H - 2 * Lo) / s) + 1;
  return ceilE(H / s) + 1;
}

// Split a bar longer than the stock length into lapped pieces
function splitPiece(len, stock, lap) {
  const out = [];
  if (stock <= lap) return null;
  while (len > stock + EPS) { out.push(stock); len = len - stock + lap; }
  out.push(len);
  return out;
}
// First-fit decreasing, grouping identical lengths. pieces: Map len -> count
function ffdBars(pieces, stock) {
  const lens = [...pieces.keys()].sort((a, b) => b - a);
  const bins = [];   // remaining length in each purchased bar
  for (const len of lens) {
    let c = pieces.get(len);
    for (let i = 0; i < bins.length && c > 0; i++) {
      const fit = Math.min(c, floorE(bins[i] / len));
      if (fit > 0) { bins[i] = round(bins[i] - fit * len, 4); c -= fit; }
    }
    const per = floorE(stock / len);
    while (c > 0) { const k = Math.min(c, per); bins.push(round(stock - k * len, 4)); c -= k; }
  }
  return bins.length;
}
// Choose the commercial length that needs the least purchased steel for one diameter
function optimizeDia(pieceList, dia, F, stockSetting) {
  const lap = lapLen(dia, F);
  const cands = stockSetting === 'auto' ? F.rebar.commercial : [Number(stockSetting)];
  let net = 0;
  for (const p of pieceList) net += p.len * p.n;
  let best = null;
  for (const L of cands) {
    const pieces = new Map(); let splices = 0, ok = true;
    for (const p of pieceList) {
      const segs = splitPiece(p.len, L, lap);
      if (!segs) { ok = false; break; }
      splices += (segs.length - 1) * p.n;
      for (const s of segs) { const k = round(s, 3); pieces.set(k, (pieces.get(k) || 0) + p.n); }
    }
    if (!ok) continue;
    const bars = ffdBars(pieces, L), purchased = bars * L;
    if (!best || purchased < best.purchased - 1e-6 || (Math.abs(purchased - best.purchased) < 1e-6 && bars < best.bars))
      best = {stock: L, bars, purchased, splices};
  }
  if (!best) return null;
  best.dia = dia; best.net = net;
  best.netKg = net * kgpm(dia);
  best.kg = best.purchased * kgpm(dia) * (1 + F.rebar.allowancePct / 100);
  best.wastePct = best.purchased > 0 ? (best.purchased - net) / best.purchased * 100 : 0;
  return best;
}

// ---- Shared element pieces
function newOut() { return {bars: [], lines: [], labor: [], x: 0, info: []}; }
function bar(o, dia, len, n, desc, div = 'REBAR') {
  n = Math.round(n);
  if (n > 0 && len > 0 && dia > 0) o.bars.push({dia: +dia, len: round(len, 3), n, desc, div});
}
function concreteOut(o, vol, cls, F) {
  if (!(vol > 0)) return;
  const c = F.concrete[cls] || F.concrete.A, v = vol * (1 + F.waste.concrete / 100);
  o.lines.push({div: 'CONC', code: 'CEM', qty: v * c.cement}, {div: 'CONC', code: 'SAND', qty: v * c.sand}, {div: 'CONC', code: 'GRAV', qty: v * c.gravel});
  o.labor.push({div: 'CONC', code: 'L_CONC', qty: vol});
  o.info.push(['Concrete', fmt(vol, 3) + ' m³ (class ' + cls + ')']);
}
function formOut(o, area) {
  if (!(area > 0)) return;
  o.lines.push({div: 'FORM', code: 'FORM', qty: area});
  o.labor.push({div: 'FORM', code: 'L_FORM', qty: area});
  o.info.push(['Formwork', fmt(area) + ' m²']);
}
function parseOpenings(text) {
  const res = {area: 0, count: 0, list: [], errors: []};
  String(text || '').split(/[,;\n]+/).map(s => s.trim()).filter(Boolean).forEach(s => {
    const m = s.match(/^([\d.]+)\s*[x×*]\s*([\d.]+)(?:\s*[x×*]\s*(\d+))?$/i);
    if (!m) { res.errors.push(s); return; }
    const w = +m[1], h = +m[2], n = m[3] ? +m[3] : 1;
    res.area += w * h * n; res.count += n; res.list.push({w, h, n});
  });
  return res;
}

// Fill missing inputs with defaults, coerce numbers
function normInputs(type, inp) {
  const out = {};
  for (const f of TYPES[type].fields) {
    if (!f.k) continue;
    let v = inp && inp[f.k] !== undefined ? inp[f.k] : f.def;
    if (f.t === 'num') v = Number(v) || 0;
    else if (f.t === 'chk') v = !!v;
    else if (f.t === 'sel' && typeof f.def === 'number') v = Number(v);
    out[f.k] = v;
  }
  return out;
}
function computeElement(el, F) {
  const o = TYPES[el.type].calc(normInputs(el.type, el.inp), F);
  const kg = o.bars.reduce((s, b) => s + b.len * b.n * kgpm(b.dia), 0);
  if (o.bars.length) o.info.unshift(['Rebar (net, 1 element)', fmt(kg) + ' kg']);
  o.kg = kg;
  return o;
}

// Build the whole estimate: per level, per division quantities and costs
function buildEstimate(st) {
  const F = st.factors, set = st.settings, levels = [];
  for (const lv of st.levels) {
    const els = st.elements.filter(e => e.level === lv.id);
    const divs = {};
    const D = k => divs[k] || (divs[k] = {lines: new Map(), labor: new Map(), bars: new Map(), x: 0, rebar: []});
    for (const el of els) {
      const q = Math.max(0, Math.round(+el.qty || 0)), r = computeElement(el, F);
      for (const b of r.bars) {
        const d = D(b.div), arr = d.bars.get(b.dia) || [];
        arr.push({len: b.len, n: b.n * q}); d.bars.set(b.dia, arr);
      }
      if (r.bars.length && r.x) D(r.bars[0].div).x += r.x * q;
      for (const l of r.lines) { const d = D(l.div); d.lines.set(l.code, (d.lines.get(l.code) || 0) + l.qty * q); }
      for (const l of r.labor) { const d = D(l.div); d.labor.set(l.code, (d.labor.get(l.code) || 0) + l.qty * q); }
    }
    for (const [k, d] of Object.entries(divs)) {
      let netKg = 0;
      for (const dia of [...d.bars.keys()].sort((a, b) => a - b)) {
        const opt = optimizeDia(d.bars.get(dia), dia, F, set.stock);
        if (!opt) continue;

      if (k === 'REBAR' && netKg > 0) d.labor.set('L_RB', (d.labor.get('L_RB') || 0) + netKg);

}
function qtyRound(qty, unit) { return CEIL_UNITS.has(unit) ? ceilE(qty) : round(qty, 2); }

// Costed BOQ rows
function buildBOQ(st) {
  const est = buildEstimate(st), P = st.prices, Lb = st.labor, rows = [], divTotals = [];
  for (const [dk, dname] of DIVS) {
    const parts = est.filter(e => e.divs[dk]);
    if (!parts.length) continue;
    rows.push({kind: 'div', text: dname});
    let divTotal = 0;
    for (const {level, divs} of parts) {
      const d = divs[dk];
      rows.push({kind: 'lvl', text: level.name});
      let mat = 0, lab = 0;
      for (const [code] of MATERIALS) {
        if (!d.lines.has(code)) continue;
        const m = P[code], qty = qtyRound(d.lines.get(code), m.unit), amt = qty * (+m.price || 0);
        let name = m.name;
        if (code.startsWith('RB')) { const o = d.rebar.find(r => 'RB' + r.dia === code); if (o) name += ` (${o.bars} pcs × ${o.stock} m)`; }
        rows.push({kind: 'mat', code, name, unit: m.unit, qty, rate: +m.price || 0, amt}); mat += amt;
      }
      for (const [code] of LABOR) {
        if (!d.labor.has(code)) continue;
        const l = Lb[code];
        if (l.mode === 'pct') {
          const amt = mat * (+l.rate || 0) / 100;
          rows.push({kind: 'lab', code, name: l.name, unit: '%', qty: +l.rate || 0, rate: mat, amt, pct: true}); lab += amt;
        } else {
          const qty = round(d.labor.get(code), 2), amt = qty * (+l.rate || 0);
          rows.push({kind: 'lab', code, name: l.name, unit: l.unit, qty, rate: +l.rate || 0, amt}); lab += amt;
        }
      }
      rows.push({kind: 'sub', text: 'Subtotal – ' + level.name, mat, lab, amt: mat + lab});
      divTotal += mat + lab;
    }
    divTotals.push({div: dk, name: dname, amt: divTotal});
  }
  const s = st.settings, direct = divTotals.reduce((a, b) => a + b.amt, 0);
  const ocm = direct * s.ocm / 100, profit = direct * s.profit / 100, cont = direct * s.contingency / 100;
  const sub = direct + ocm + profit + cont, vat = sub * s.vat / 100;
  return {rows, divTotals, totals: {direct, ocm, profit, cont, sub, vat, grand: sub + vat}, est};
}

// ---- BOQ with element-priced items. Legacy result is returned unchanged when there are none.
function collectPriced(st) {
  const out = [];
  for (const el of st.elements) {
    const T = TYPES[el.type]; if (!T || !T.module) continue;
    const q = Math.max(0, Math.round(+el.qty || 0)); if (!q) continue;
    for (const c of computeElement(el, st.factors).custom || []) out.push({level: el.level, div: c.div, name: `${el.mark}: ${c.name}`, unit: c.unit, qty: c.qty * q, rate: c.rate, elementId: el.id});
  }
  return out;
}
{
  const legacy = buildBOQ;
  buildBOQ = function (st) {
    const b = legacy(st), items = collectPriced(st);
    if (!items.length) return b;
    // Rebuild the row list block by block (division → level); legacy rows keep their values.
    const blocks = new Map(), key = (d, l) => d + '|' + l, divKey = Object.fromEntries(DIVS.map(([k, n]) => [n, k]));
    const estLevels = dk => b.est.filter(e => e.divs[dk]).map(e => e.level.id);
    let dk = null, li = -1;
    for (const r of b.rows) {
      if (r.kind === 'div') { dk = divKey[r.text]; li = -1; }
      else if (r.kind === 'lvl') { li++; blocks.set(key(dk, estLevels(dk)[li]), {mats: [], labs: []}); }
      else if (r.kind === 'mat') blocks.get(key(dk, estLevels(dk)[li])).mats.push(r);
      else if (r.kind === 'lab') blocks.get(key(dk, estLevels(dk)[li])).labs.push(r);
    }
    for (const it of items) {
      const k = key(it.div, it.level);
      if (!blocks.has(k)) blocks.set(k, {mats: [], labs: []});
      blocks.get(k).mats.push({kind: 'mat', code: 'PRICED', name: it.name, unit: it.unit, qty: it.qty, rate: it.rate, amt: it.qty * it.rate, custom: true, elementId: it.elementId});
    }
    const rows = [], divTotals = [];
    for (const [d, dname] of DIVS) {
      const lv = st.levels.filter(l => blocks.has(key(d, l.id)));
      if (!lv.length) continue;
      rows.push({kind: 'div', text: dname});
      let divTotal = 0;
      for (const l of lv) {
        const blk = blocks.get(key(d, l.id));
        rows.push({kind: 'lvl', text: l.name});
        let mat = 0, lab = 0;
        for (const r of blk.mats) { rows.push(r); mat += r.amt; }
        for (const r of blk.labs) {
          const x = r.pct ? {...r, rate: mat, amt: mat * r.qty / 100} : r;   // %-of-materials labor includes element-priced items
          rows.push(x); lab += x.amt;
        }
        rows.push({kind: 'sub', text: 'Subtotal – ' + l.name, mat, lab, amt: mat + lab});
        divTotal += mat + lab;
      }
      divTotals.push({div: d, name: dname, amt: divTotal});
    }
    const s = st.settings, direct = divTotals.reduce((a, x) => a + x.amt, 0);
    const ocm = direct * s.ocm / 100, profit = direct * s.profit / 100, cont = direct * s.contingency / 100;
    const sub = direct + ocm + profit + cont, vat = sub * s.vat / 100;
    return {rows, divTotals, totals: {direct, ocm, profit, cont, sub, vat, grand: sub + vat}, est: b.est};
  };
}

  'R-STALE-002': ['info', 'Estimate has changed since the last export'],
};

function defaultAuditState() {
  return {policy: {priceValidityDays: 90, unverifiedCoefficients: 'critical', exportPolicy: 'draft-watermark'}, acks: {}, approval: null, approvalLog: [], lastExport: null};
}

// ---- Hashing (FNV-1a, two seeds) over canonical JSON
function fnv(s, seed) { let h = seed >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
const hash64 = s => fnv(s, 0x811c9dc5) + fnv(s, 0x01234567);
function canon(x) {
  if (Array.isArray(x)) return '[' + x.map(canon).join(',') + ']';
  if (x && typeof x === 'object') return '{' + Object.keys(x).sort().map(k => JSON.stringify(k) + ':' + canon(x[k])).join(',') + '}';
  return JSON.stringify(x === undefined ? null : x);
}
// Hash of everything that can change a quantity or a cost (metadata excluded)
function inputHashes(st) {
  const parts = {
    levels: st.levels.map(l => ({id: l.id, name: l.name})),
    elements: st.elements.map(e => ({id: e.id, type: e.type, mark: e.mark, level: e.level, qty: e.qty, inp: e.inp})),
    factors: st.factors,
    prices: Object.fromEntries(Object.entries(st.prices).map(([k, p]) => [k, {name: p.name, price: p.price}])),
    labor: Object.fromEntries(Object.entries(st.labor).map(([k, l]) => [k, {name: l.name, mode: l.mode, rate: l.rate}])),
    settings: st.settings,
  };
  const h = Object.fromEntries(Object.entries(parts).map(([k, v]) => [k, hash64(canon(v))]));
  h.all = hash64(canon(h));
  return h;
}

// ---- Which coefficients an element's calculation reads (superset is safe)
function factorsUsed(el, F) {
  const t = el.type, i = normInputs(t, el.inp), u = new Set(), add = (...p) => p.forEach(x => u.add(x));
  if (TYPES[t] && TYPES[t].factors) add(...TYPES[t].factors(i));
  const rebar = () => add('rebar.lapFactor', 'rebar.commercial', 'rebar.tieWirePerX', 'rebar.tieWireMPerKg', 'rebar.allowancePct');
  const board = b => add(`boards.${b}.w`, `boards.${b}.l`);
  if (['footing', 'wallfooting', 'column', 'beam', 'slab', 'rcwall', 'stairs'].includes(t)) {
    rebar(); add(`concrete.${i.cls}.cement`, `concrete.${i.cls}.sand`, `concrete.${i.cls}.gravel`, 'waste.concrete');
    if ((t === 'footing' || t === 'wallfooting') && i.hook) add('rebar.hook90D');
    if (t === 'column' || t === 'beam') add('rebar.tieHookD', 'rebar.tieHookMin');
  } else if (t === 'chbwall' || t === 'chbpart') {
    rebar(); add('chb.perSqm', 'chb.courseH', `chb.mortar.${i.size}.${i.mcls}`, `chb.mortar.${i.size}.sand`);
    if (+i.faces > 0) add(`plaster.${i.pcls}`, 'plaster.sandPerCum');
  } else if (t === 'drywall') {
    add('partition.studLen', 'partition.trackLen', 'partition.anchorSp', 'partition.screwsPerBoard', 'partition.tapePerSqm', 'partition.compoundPerSqm', 'waste.metal'); board(i.board);
  } else if (t === 'ceiling') {
    const C = 'ceiling.';
    if (i.sys === 'gyp' || i.sys === 'fc') {
      let b = i.board;
      if (i.sys === 'gyp' && !/^(GYP|MR)/.test(b)) b = 'GYP9';
      if (i.sys === 'fc' && !/^FC/.test(b)) b = 'FC45';
      board(b); add('waste.metal', ...['ccSpacing', 'stockLen', 'wallAngleLen', 'hangerSpacing', 'hangerLen', 'screwsPerBoard', 'rivetsPerFurring'].map(k => C + k));
      if (/^(GYP|MR)/.test(b)) add(C + 'tapePerSqm', C + 'compoundPerSqm');
    } else if (i.sys === 'acoustic') add(...['acousticMainSp', 'acousticMainLen', 'acousticTile', 'acousticWallAngle', 'hangerLen'].map(k => C + k));
    else if (i.sys === 'pvc') add('waste.metal', ...['pvcWidth', 'pvcLength', 'stockLen', 'pvcMoldingLen', 'pvcScrewsPerSqm'].map(k => C + k));
    else if (i.sys === 'wood') { board('PLY6'); add(C + 'bdftPerM', C + 'nailsKgPerSqm'); }
  }
  return u;
}

// ---- Element-level rules (also used live in the editor)
function elementChecks(el, F) {
  const out = [], T = TYPES[el.type];
  const R = (rule, path, description, evidence, suggestion) => out.push({rule, path, description, evidence, suggestion});
  const raw = el.inp || {}, i = normInputs(el.type, raw), rel = RELEVANT[el.type] || T.relevant || {}, zeroOk = k => ALLOW_ZERO.has(k) || !!(T.allowZero && T.allowZero.has(k));
  for (const f of T.fields) {
    if (!f.k || f.t !== 'num') continue;
    if (rel[f.k] && !rel[f.k](i)) continue;
    const v = raw[f.k] === undefined ? f.def : raw[f.k], n = Number(v), label = `${f.label}${f.unit ? ' (' + f.unit + ')' : ''}`;
    if (!Number.isFinite(n) || v === null || v === '') { R('R-DIM-001', f.k, `${label} is not a number.`, {field: f.k, value: String(v)}, 'Enter a number.'); continue; }
    if (n < 0) { R('R-DIM-002', f.k, `${label} is negative (${n}).`, {field: f.k, value: n}, 'Enter a positive value from the drawing.'); continue; }
    if (n === 0 && !zeroOk(f.k)) {
      const money = String(f.unit || '').startsWith('₱');
      R('R-DIM-003', f.k, money ? `${label} is 0, so this item has no price.` : `${label} is 0, which removes quantities from the estimate.`, {field: f.k, value: n}, money ? 'Enter the unit cost from the supplier quotation.' : 'Enter the value from the drawing.');
      continue;
    }
    if (n === 0 || T.module) continue;   // module fields have their own plausibility checks (T.checks)
    const L = AUDIT_LIMITS;
    if (f.unit === 'm') {
      if (n > L.mMax || (SECTION_KEYS.has(f.k) && n > L.sectionMax)) R('R-UNIT-001', f.k, `${label} = ${n} m is unusually large; it may have been entered in mm or cm.`, {field: f.k, value: n, unit: 'm', limit: SECTION_KEYS.has(f.k) ? L.sectionMax : L.mMax}, 'Check the unit: this field is in metres.');
      else if (n < L.mMin) R('R-UNIT-001', f.k, `${label} = ${n} m is unusually small.`, {field: f.k, value: n, unit: 'm', limit: L.mMin}, 'Check the unit: this field is in metres.');
    } else if (f.unit === 'mm') {
      if (f.k === 'cover' && (n < L.coverMin || n > L.coverMax)) R('R-UNIT-001', f.k, `Cover = ${n} mm is outside ${L.coverMin}–${L.coverMax} mm; it may have been entered in metres or cm.`, {field: f.k, value: n, unit: 'mm', range: [L.coverMin, L.coverMax]}, 'Check the unit: cover is in millimetres.');
      else if (f.k === 'plt' && (n < L.plasterMin || n > L.plasterMax)) R('R-UNIT-001', f.k, `${label} = ${n} mm is outside ${L.plasterMin}–${L.plasterMax} mm; it may have been entered in cm or metres.`, {field: f.k, value: n, unit: 'mm', range: [L.plasterMin, L.plasterMax]}, 'Check the unit: plaster thickness is in millimetres.');
      else if (/^s[A-Z]/.test(f.k) && (n < L.spacingMin || n > L.spacingMax)) R('R-UNIT-001', f.k, `${label} = ${n} mm is outside ${L.spacingMin}–${L.spacingMax} mm; it may have been entered in metres.`, {field: f.k, value: n, unit: 'mm', range: [L.spacingMin, L.spacingMax]}, 'Check the unit: spacing is in millimetres.');
    }
  }
  const q = Number(el.qty);
  if (!(q > 0) || !Number.isInteger(q)) R('R-DIM-004', 'qty', !(q > 0) ? 'Quantity is 0, so this element is not costed.' : `Quantity ${q} is not a whole number; ${Math.round(q)} is used.`, {qty: el.qty, used: Math.max(0, Math.round(q || 0))}, 'Enter the number of identical elements as a whole number.');

  // Geometry: inner dimensions after cover
  const c = (Number(i.cover) || 0) / 1000;
  const inner = {column: [['b', i.b], ['h', i.h]], beam: [['b', i.b], ['h', i.h]], footing: [['L', i.L], ['W', i.W]], wallfooting: [['B', i.B], ['L', i.L]], slab: [['Lx', i.Lx], ['Ly', i.Ly]], rcwall: [['L', i.L], ['H', i.H]], stairs: [['W', i.W]]}[el.type] || [];
  for (const [k, d] of inner) if (d > 0 && d - 2 * c <= 0) R('R-RB-001', k, `Cover ${i.cover} mm on each side is not less than half of ${k} = ${d} m, so the bars have no length (ties would be cut to their hooks only).`, {dimension: k, value: d, cover: i.cover, inner: Math.round((d - 2 * c) * 1000) / 1000}, 'Check the cover and the member size.');
  const spans = {
    footing: [['sL', i.W - 2 * c], ['sW', i.L - 2 * c]], wallfooting: [['sT', i.L - 2 * c]], slab: [['sBx', i.Ly - 2 * c], ['sBy', i.Lx - 2 * c]],
    rcwall: [['sV', i.L - 2 * c], ['sH', i.H - 2 * c]], stairs: [['sM', i.W - 2 * c], ['sD', Math.hypot(i.run, i.rise)]], column: [['sT', i.H]], beam: [['sS', i.L]],
  }[el.type] || [];
  for (const [k, w] of spans) if (i[k] > 0 && w > 0 && i[k] / 1000 >= w) R('R-RB-002', k, `Spacing ${i[k]} mm is not smaller than the available width ${Math.round(w * 1000)} mm, so only one bar is counted.`, {field: k, spacing: i[k], width_mm: Math.round(w * 1000)}, 'Check the spacing unit and value.');
  if ((el.type === 'column' || el.type === 'beam') && i.Lo > 0) {
    const len = el.type === 'column' ? i.H : i.L;
    if (2 * i.Lo >= len) R('R-RB-004', 'Lo', `Confined zones (2 × ${i.Lo} m) cover the whole length ${len} m, so the uniform spacing is used instead.`, {Lo: i.Lo, length: len}, 'Reduce the confined zone length or set it to 0.');
  }
  if (['chbwall', 'chbpart', 'drywall'].includes(el.type)) {
    const op = parseOpenings(i.open);
    if (op.errors.length) R('R-DIM-006', 'open', `Openings "${op.errors.join(', ')}" could not be read and are not deducted.`, {unreadable: op.errors}, 'Write openings as W x H x count, e.g. 0.9x2.1x2.');
    if (i.L > 0 && i.H > 0 && op.area >= i.L * i.H) R('R-DIM-005', 'open', `Openings (${Math.round(op.area * 100) / 100} m²) are not smaller than the wall (${Math.round(i.L * i.H * 100) / 100} m²), so the net area is 0.`, {openings_m2: Math.round(op.area * 1e4) / 1e4, wall_m2: Math.round(i.L * i.H * 1e4) / 1e4}, 'Check the opening sizes and the wall length/height.');
  }
  if (T.checks) for (const c of T.checks(i)) R(c.rule, c.path, c.description, c.evidence, c.suggestion);
  let r = null;
  try { r = computeElement(el, F); } catch (e) { R('R-QTY-001', '', 'The calculation failed: ' + e.message, {error: e.message}, 'Check the inputs.'); }
  if (r && r.missing && r.missing.length) R('R-COEF-003', 'missing', `Coefficient(s) not set: ${r.missing.join(', ')}. The quantities that need them are left out of the BOQ.`, {coefficients: r.missing}, 'Enter each value on the Factors tab from its cited source, record the table/page and tick Verified.');
  const nothing = r && !r.lines.length && !r.bars.length && !(r.custom && r.custom.length) && !(T.laborOnly && r.labor.some(l => l.qty > 0));
  if (nothing && !out.some(x => RULES[x.rule][0] === 'critical')) R('R-QTY-001', '', 'These inputs produce no material quantities.', {lines: 0, bars: 0}, 'Check the dimensions, spacing and cover.');
  return out;
}

// ---- Reconciliation of a BOQ (pure; used by runAudit and tested with tampered input)
function reconcileChecks(boq, s) {
  // money tolerance: half a centavo (relative 1e-9 only to absorb floating-point noise on very large totals)
  const T = boq.totals, near = (a, b) => Math.abs(a - b) <= Math.max(0.005, 1e-9 * Math.abs(b)), r2 = x => Math.round(x * 100) / 100;
  const failures = [], nonFinite = [];
  for (const [k, v] of Object.entries(T)) if (!Number.isFinite(v)) nonFinite.push(k + ' total');
  if (boq.rows.some(r => (r.kind === 'mat' || r.kind === 'lab') && !Number.isFinite(r.amt))) nonFinite.push('BOQ line amount');
  let sub = 0, lineSum = 0, divSum = 0, printedLines = 0, printedSubs = 0, printedDirect = 0;
  for (const r of boq.rows) {
    if (r.kind === 'mat' || r.kind === 'lab') {
      const exp = r.pct ? r.rate * r.qty / 100 : r.qty * r.rate;
      if (!near(r.amt, exp)) failures.push(`${r.name}: amount ${r.amt} ≠ qty × rate ${exp}`);
      sub += r.amt; lineSum += r.amt; printedLines += r2(r.amt);
    } else if (r.kind === 'sub') {
      if (!near(r.amt, sub)) failures.push(`${r.text}: subtotal ${r.amt} ≠ sum of lines ${sub}`);
      if (Math.abs(r2(printedLines) - r2(r.amt)) >= 0.01) printedSubs++;
      sub = 0; printedLines = 0;
    }
  }
  for (const d of boq.divTotals) { divSum += d.amt; printedDirect += r2(d.amt); }
  if (!near(divSum, T.direct)) failures.push(`division totals ${divSum} ≠ direct cost ${T.direct}`);
  if (!near(lineSum, T.direct)) failures.push(`line amounts ${lineSum} ≠ direct cost ${T.direct}`);
  if (!near(T.ocm, T.direct * s.ocm / 100) || !near(T.profit, T.direct * s.profit / 100) || !near(T.cont, T.direct * s.contingency / 100)) failures.push('markups ≠ direct cost × rate');
  if (!near(T.sub, T.direct + T.ocm + T.profit + T.cont)) failures.push('subtotal ≠ direct cost + markups');
  if (!near(T.vat, T.sub * s.vat / 100) || !near(T.grand, T.sub + T.vat)) failures.push('VAT or grand total inconsistent');
  return {failures: nonFinite.length ? [] : failures, nonFinite, printedSubs, printedDirectDiff: Math.round(Math.abs(r2(printedDirect) - r2(T.direct)) * 100)};
}

// ---- Project-level audit
function runAudit(st, {today} = {}) {
  const F = st.factors, P = st.policy || (st.audit && st.audit.policy) || defaultAuditState().policy, A = st.audit || defaultAuditState();
  const projectId = (st.meta && st.meta.projectId) || '', revision = (st.meta && st.meta.revision) || 0;
  const found = [], markOf = id => (st.elements.find(e => e.id === id) || {}).mark;
  const F_ = (rule, key, description, evidence, suggestion, elementIds = [], paths = []) => {
    const [severity, title] = RULES[rule];
    found.push({rule, key, severity, title, description, evidence, suggestion, elementIds, paths});
  };
  const levelName = id => (st.levels.find(l => l.id === id) || {}).name || '?';
  // Element rules
  for (const el of st.elements) for (const c of elementChecks(el, F))
    F_(c.rule, el.id + '|' + c.path, `${el.mark} (${TYPES[el.type].name}, ${levelName(el.level)}): ${c.description}`, c.evidence, c.suggestion, [el.id], c.path ? [`elements.${el.id}.inp.${c.path}`] : []);

  const boq = buildBOQ(st), est = boq.est;
  // Rebar purchasable
  for (const {level, divs} of est) for (const [dk, d] of Object.entries(divs)) for (const dia of d.bars.keys()) if (!d.rebar.some(o => o.dia === dia)) {
    const ids = st.elements.filter(e => e.level === level.id && computeElement(e, F).bars.some(b => b.dia === dia && b.div === dk)).map(e => e.id);
    F_('R-RB-003', `${level.id}|${dk}|${dia}`, `${dia} mm bars on ${level.name} (${DIV_NAME[dk]}) cannot be bought: no commercial length is longer than the ${Math.round(lapLen(dia, F) * 100) / 100} m lap, so they are missing from the BOQ.`,
      {dia, lap_m: Math.round(lapLen(dia, F) * 1000) / 1000, commercial: st.settings.stock === 'auto' ? F.rebar.commercial : [Number(st.settings.stock)]}, 'Use a longer commercial length or check the lap factor.', ids);
  }
  // Prices
  const matRows = boq.rows.filter(r => r.kind === 'mat' && !r.custom), labRows = boq.rows.filter(r => r.kind === 'lab');
  for (const r of boq.rows.filter(r => r.custom && !(Number(r.rate) > 0))) F_('R-PRICE-001', 'priced|' + r.elementId + '|' + r.name, `${r.name} has no unit cost.`, {item: r.name, unit: r.unit, qty: r.qty, rate: r.rate}, 'Enter the unit cost in the element (from the supplier quotation).', [r.elementId]);
  const usedMat = [...new Set(matRows.map(r => r.code))], usedLab = [...new Set(labRows.map(r => r.code))];
  for (const c of usedMat) { const p = st.prices[c]; if (!(Number(p.price) > 0)) F_('R-PRICE-001', c, `${p.name} is in the BOQ with a price of ${p.price}.`, {code: c, price: p.price}, 'Enter the supplier price.', [], ['prices.' + c]); }
  const sampleM = usedMat.filter(c => st.prices[c].source === 'sample');
  if (sampleM.length) F_('R-PRICE-002', 'materials', `${sampleM.length} of ${usedMat.length} priced materials use sample prices. Sample prices are placeholders, not market data.`, {codes: sampleM}, 'Enter your supplier prices on the Prices tab.', [], sampleM.map(c => 'prices.' + c));
  if (today) {
    const t0 = Date.parse(today), days = Number(P.priceValidityDays) || 0, old = [], undated = [];
    for (const [c, o, kind] of [...usedMat.map(c => [c, st.prices[c], 'prices']), ...usedLab.map(c => [c, st.labor[c], 'labor'])]) {
      if (o.source !== 'user') continue;
      if (!o.updatedAt) { undated.push(`${kind}.${c}`); continue; }
      const age = Math.floor((t0 - Date.parse(o.updatedAt)) / 86400000);
      if (days > 0 && age > days) old.push({path: `${kind}.${c}`, updatedAt: o.updatedAt, ageDays: age});
    }
    if (old.length) F_('R-PRICE-003', 'expired', `${old.length} price(s) are older than ${days} days.`, {validityDays: days, prices: old}, 'Confirm or update these prices.', [], old.map(o => o.path));
    if (undated.length) F_('R-PRICE-006', 'undated', `${undated.length} of your price(s) have no recorded date, so their age cannot be checked.`, {paths: undated}, 'Re-enter the price to record today\'s date.', [], undated);
  }
  for (const c of usedLab) { const l = st.labor[c]; if (!(Number(l.rate) > 0)) F_('R-PRICE-004', c, `${l.name} has a rate of ${l.rate}${l.mode === 'pct' ? '%' : ''}.`, {code: c, rate: l.rate}, 'Enter the labor rate, or confirm labor is excluded.', [], ['labor.' + c]); }
  const sampleL = usedLab.filter(c => st.labor[c].source === 'sample');
  if (sampleL.length) F_('R-PRICE-005', 'labor', `${sampleL.length} labor rate(s) are sample values.`, {codes: sampleL}, 'Enter your own labor rates on the Prices tab.', [], sampleL.map(c => 'labor.' + c));
  // Coefficients
  const FM = st.factorMeta || {}, use = new Map();
  for (const el of st.elements) if (Number(el.qty) > 0) for (const p of factorsUsed(el, F)) { if (!use.has(p)) use.set(p, []); use.get(p).push(el.id); }
  const interp = [...use.keys()].filter(p => FM[p] && /interpolated/i.test(FM[p].source || '') && !FM[p].verified);
  const valueOf = p => p.split('.').reduce((a, k) => (a == null ? a : a[k]), F);
  const unver = [...use.keys()].filter(p => FM[p] && !FM[p].verified && !interp.includes(p) && valueOf(p) !== null && valueOf(p) !== undefined).sort();   // unset ones are R-COEF-003
  if (interp.length) F_('R-COEF-002', 'interp', `${interp.join(', ')} ${interp.length > 1 ? 'are' : 'is'} interpolated with no cited source and ${interp.length > 1 ? 'are' : 'is'} used by ${new Set(interp.flatMap(p => use.get(p))).size} element(s).`,
    {coefficients: interp.map(p => ({path: p, source: FM[p].source, note: FM[p].note}))}, 'Replace the value with one from a cited table and record the reference, or use a different CHB size.', [...new Set(interp.flatMap(p => use.get(p)))], interp.map(p => 'factors.' + p));
  if (unver.length) {
    found.push({rule: 'R-COEF-001', key: 'unverified', severity: P.unverifiedCoefficients === 'major' ? 'major' : 'critical', title: RULES['R-COEF-001'][1],
      description: `${unver.length} coefficient(s) used by this estimate are not verified against their source.`,
      evidence: {coefficients: unver.map(p => ({path: p, source: FM[p].source, ref: FM[p].ref, elements: use.get(p).length}))},
      suggestion: 'On the Factors tab, check each value against its source, record the table/page and tick Verified.', elementIds: [], paths: unver.map(p => 'factors.' + p)});
  }
  // Duplicates
  const sig = new Map(), marks = new Map();
  for (const e of st.elements) {
    const k = canon({type: e.type, level: e.level, inp: normInputs(e.type, e.inp)});
    if (!sig.has(k)) sig.set(k, []); sig.get(k).push(e.id);
    const m = String(e.mark).trim().toLowerCase(); if (!marks.has(m)) marks.set(m, []); marks.get(m).push(e.id);
  }
  for (const ids of sig.values()) if (ids.length > 1) F_('R-DUP-001', ids.join('|'), `${ids.map(markOf).join(', ')} have the same type, level and inputs.`, {elements: ids.map(markOf)}, 'If they are the same element, delete one; if they are separate, increase the quantity of one instead.', ids);
  for (const [m, ids] of marks) if (ids.length > 1) F_('R-DUP-002', 'mark|' + m, `Mark "${markOf(ids[0])}" is used by ${ids.length} elements.`, {mark: markOf(ids[0]), elements: ids.length}, 'Give each element its drawing mark.', ids);
  // Overlaps (upper bounds; depends on how depths/heights were measured)
  for (const lv of st.levels) {
    const at = t => st.elements.filter(e => e.level === lv.id && e.type === t && Number(e.qty) > 0);
    const beams = at('beam'), slabs = at('slab'), cols = at('column'), N = e => normInputs(e.type, e.inp), qn = e => Math.round(Number(e.qty));
    if (beams.length && slabs.length) {
      const t = Math.max(...slabs.map(e => N(e).t)), bound = beams.reduce((s, e) => s + N(e).b * N(e).L * Math.min(t, N(e).h) * qn(e), 0);
      F_('R-OVL-001', lv.id, `${lv.name}: beams and slabs are both costed at full depth. If the beam depth includes the slab, up to ${Math.round(bound * 1000) / 1000} m³ of concrete is counted twice.`,
        {level: lv.name, maxSlabThickness_m: t, beams: beams.map(e => e.mark), overlapUpperBound_m3: Math.round(bound * 1e6) / 1e6}, 'If beam depths include the slab, enter the depth below the slab, or accept this as a known allowance.', beams.concat(slabs).map(e => e.id));
    }
    if (beams.length && cols.length) {
      const hb = Math.max(...beams.map(e => N(e).h)), bound = cols.reduce((s, e) => s + N(e).b * N(e).h * hb * qn(e), 0);

// ---- Derived numbers for the dashboard (all from buildBOQ / buildEstimate)
function dashData() {
  const b = buildBOQ(S), divKey = Object.fromEntries(DIVS.map(([k, n]) => [n, k]));
  const divs = Object.fromEntries(DIVS.map(([k, n]) => [k, {key: k, name: n, amt: 0, mat: 0, lab: 0, items: 0}]));
  const lvl = new Map();
  let curDiv = null, curLvl = null;
  for (const r of b.rows) {
    if (r.kind === 'div') curDiv = divKey[r.text];
    else if (r.kind === 'lvl') curLvl = r.text;
    else if (r.kind === 'sub') { const d = divs[curDiv]; d.mat += r.mat; d.lab += r.lab; d.amt += r.amt; lvl.set(curLvl, (lvl.get(curLvl) || 0) + r.amt); }

  let rebarKg = 0, rebarNetKg = 0, rebarPcs = 0, purchasedM = 0, netM = 0, conc = 0, form = 0, chb = 0, ceil = 0, part = 0, missingRebar = [];
  for (const {level, divs: dv} of b.est) for (const [k, d] of Object.entries(dv)) {
    for (const o of d.rebar) { rebarKg += o.kg; rebarNetKg += o.netKg; rebarPcs += o.bars; purchasedM += o.purchased; netM += o.net; }
    for (const dia of d.bars.keys()) if (!d.rebar.some(o => o.dia === dia)) missingRebar.push(`${dia} mm (${level.name}, ${DIV_NAME[k]})`);

}

  if (typeof ACT[act] === 'function') { ev.preventDefault(); act in App ? App[act](arg) : ACT[act](); }
});
// data-bind="<kind>:<key>[:<field>]" writes typed values into known places only
document.addEventListener('change', ev => {
  const t = ev.target.closest('[data-bind]'); if (!t) return;
  const [kind, key, field] = t.dataset.bind.split(':');
  const num = () => { const v = Number(t.value); return Number.isFinite(v) ? v : 0; };
  const today = localDate();
  if (kind === 'project' && hasOwn(S.project, key)) S.project[key] = t.value;
  else if (kind === 'setting' && hasOwn(S.settings, key)) S.settings[key] = key === 'stock' ? t.value : num();
  else if (kind === 'level') { const l = S.levels.find(x => x.id === key); if (!l) return; if (field === 'name') l.name = t.value; else if (field === 'h') l.h = num(); }
  else if (kind === 'price' && hasOwn(S.prices, key)) { const p = S.prices[key]; if (field === 'name') p.name = t.value; else if (field === 'price') p.price = num(); p.source = 'user'; p.updatedAt = today; }
  else if (kind === 'labor' && hasOwn(S.labor, key)) { const l = S.labor[key]; if (field === 'name') l.name = t.value; else if (field === 'mode') l.mode = t.value === 'pct' ? 'pct' : 'unit'; else if (field === 'rate') l.rate = num(); l.source = 'user'; l.updatedAt = today; }
  else if (kind === 'factor' && hasOwn(S.factorMeta, key)) {
    const ks = key.split('.'), last = ks.pop(), o = ks.reduce((a, k) => a[k], S.factors), m = S.factorMeta[key];
    if (field === 'value') {
      if (Array.isArray(o[last])) { const arr = t.value.split(/[ ,;]+/).map(Number).filter(x => x > 0).sort((a, b) => a - b); o[last] = arr.length ? arr : [6]; }
      else if (t.value.trim() === '' && getPath(defaultFactors(), key) === null) o[last] = null;   // back to "not set"
      else o[last] = num();
      m.verified = false; m.note = (m.note ? m.note + ' ' : '') + `Value changed by user on ${today}.`;
    } else if (field === 'ref') m.ref = t.value;
    else if (field === 'verified') m.verified = t.checked;
  } else if (kind === 'policy' && hasOwn(S.audit.policy, key)) {
    if (key === 'priceValidityDays') S.audit.policy[key] = Math.max(0, Math.round(num()));
    else if (key === 'unverifiedCoefficients') S.audit.policy[key] = t.value === 'major' ? 'major' : 'critical';
    else if (key === 'exportPolicy' && EXPORT_POLICIES.some(([k]) => k === t.value)) S.audit.policy[key] = t.value;
  } else if (kind === 'takeoff') {
    if (!S.levels.some(l => l.id === key) || !TAKEOFF_SCOPES.some(x => x[0] === field)) return;
    (S.takeoff[key] = S.takeoff[key] || {})[field] = TAKEOFF_STATUS.some(x => x[0] === t.value) ? t.value : 'pending';
  } else if (kind === 'user') { try { localStorage.setItem(USER_KEY, t.value.trim()); } catch (e) {} render(); return; }
  else return;
  persist(); render();
});

      <td class="row"><button class="btn sm" data-act="edit" data-arg="${esc(e.id)}">Edit</button><button class="btn sm" data-act="copy" data-arg="${esc(e.id)}">Copy</button><button class="btn sm danger" data-act="del" data-arg="${esc(e.id)}">Delete</button></td></tr>`;

function readEditor() {
  const t = TYPES[draft.type], g = id => document.getElementById(id);

function preview() {

// ---- Rebar schedule
function vRebar() {
  const est = buildEstimate(S), F = S.factors, proj = new Map();
  let html = `<div class="card"><h2>Rebar schedule</h2><p class="muted" style="margin:0">Cut lengths include hooks and laps. Bars longer than the commercial length are spliced with a lap of ${esc(F.rebar.lapFactor)}d. Purchase quantities are optimized per level and work division.</p></div>`;
  for (const {level, divs} of est) {
    const withBars = S.elements.filter(e => e.level === level.id).map(e => ({e, r: computeElement(e, F)})).filter(x => x.r.bars.length);
    if (!withBars.length) continue;
    const xs = Object.values(divs).reduce((s, d) => s + d.x, 0);
    html += `<div class="card"><h2>${esc(level.name)}</h2><div class="tbl-wrap"><table>
      <tr><th>Mark</th><th>Bar</th><th class="n">Ø mm</th><th class="n">Cut length (m)</th><th class="n">No. / element</th><th class="n">Elements</th><th class="n">Total length (m)</th><th class="n">Weight (kg)</th></tr>
      ${withBars.map(({e, r}) => r.bars.map((b, i) => `<tr><td>${i ? '' : '<b>' + esc(e.mark) + '</b>'}</td><td>${esc(b.desc)}</td><td class="n">${b.dia}</td><td class="n">${fmt(b.len, 3)}</td><td class="n">${b.n}</td><td class="n">${esc(e.qty)}</td><td class="n">${fmt(b.len * b.n * e.qty)}</td><td class="n">${fmt(b.len * b.n * e.qty * kgpm(b.dia))}</td></tr>`).join('')).join('')}
      </table></div>
      <h3>Purchase list</h3><div class="tbl-wrap"><table><tr><th>Division</th><th class="n">Ø mm</th><th class="n">Net length (m)</th><th class="n">Splices</th><th class="n">Commercial length</th><th class="n">Bars to buy</th><th class="n">Weight to buy (kg)</th><th class="n">Waste incl. laps</th></tr>
      ${Object.entries(divs).flatMap(([dk, d]) => [...d.bars.keys()].sort((a, b) => a - b).map(dia => {
        const o = d.rebar.find(x => x.dia === dia);
        if (!o) return `<tr><td>${esc(DIV_NAME[dk])}</td><td class="n">${dia}</td><td colspan="6"><span class="pill bad">✕ Not purchasable</span> No commercial length is longer than the ${fmt(lapLen(dia, F), 2)} m lap. This bar is missing from the BOQ.</td></tr>`;
        const k = o.dia + '|' + o.stock, p = proj.get(k) || {dia: o.dia, stock: o.stock, bars: 0, kg: 0}; p.bars += o.bars; p.kg += o.kg; proj.set(k, p);
        return `<tr><td><span class="tchip" style="--c:var(--d-${dk})">${esc(DIV_NAME[dk])}</span></td><td class="n">${o.dia}</td><td class="n">${fmt(o.net)}</td><td class="n">${o.splices}</td><td class="n">${o.stock} m</td><td class="n"><b>${o.bars}</b></td><td class="n">${fmt(o.kg)}</td><td class="n">${fmt(o.wastePct, 1)}%</td></tr>`;
      })).join('')}
      </table></div>
      ${xs ? `<p class="muted">Tie wire #16: ${fmt(xs * F.rebar.tieWirePerX / F.rebar.tieWireMPerKg)} kg (${xs} intersections × ${esc(F.rebar.tieWirePerX)} m ÷ ${esc(F.rebar.tieWireMPerKg)} m/kg)</p>` : ''}
    </div>`;
  }
  if (!proj.size) return `<div class="stack">${html}<div class="card empty"><div class="big">${icon('rebar')}</div><p class="muted">No reinforced elements yet.</p></div></div>`;
  const tot = [...proj.values()].sort((a, b) => a.dia - b.dia || a.stock - b.stock);
  html += `<div class="card"><h2>Project total – rebar to order</h2><div class="tbl-wrap"><table><tr><th class="n">Ø mm</th><th class="n">Length</th><th class="n">Pieces</th><th class="n">Weight (kg)</th></tr>
    ${tot.map(p => `<tr><td class="n">${p.dia}</td><td class="n">${p.stock} m</td><td class="n"><b>${p.bars}</b></td><td class="n">${fmt(p.kg)}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">Total</td><td class="n">${tot.reduce((s, p) => s + p.bars, 0)}</td><td class="n">${fmt(tot.reduce((s, p) => s + p.kg, 0))}</td></tr></table></div></div>`;
  return `<div class="stack">${html}</div>`;
}

function boqCsv() {
  const b = buildBOQ(S), q = v => `"${noFormula(v).replace(/"/g, '""')}"`, out = [['Item', 'Description', 'Qty', 'Unit', 'Unit cost', 'Amount']];

      <span class="pill ${f.status === 'acknowledged' ? 'good' : f.status === 'reopened' ? 'warn' : ''}">${f.status === 'reopened' ? 'reopened – evidence changed' : esc(f.status)}</span>
      <span style="margin-left:auto" class="row">${f.severity === 'critical' ? '' : f.status === 'acknowledged' ? `<button class="btn sm" data-act="reopen" data-arg="${esc(f.id)}">Reopen</button>` : `<button class="btn sm" data-act="ack" data-arg="${esc(f.id)}">Acknowledge…</button>`}</span></div>
    <div style="margin-top:4px">${esc(f.description)}</div>
    ${f.refs.elementIds.length ? `<div class="row" style="margin-top:6px;gap:4px">${f.refs.elementIds.slice(0, 12).map((id, n) => `<button class="btn sm" data-act="edit" data-arg="${esc(id)}">${esc(f.refs.marks[n] || id)}</button>`).join('')}${f.refs.elementIds.length > 12 ? `<span class="muted">+${f.refs.elementIds.length - 12} more</span>` : ''}</div>` : ''}
    <div class="ev">${evid(f.evidence)}</div>
    <div class="sg"><b>Suggested action:</b> ${esc(f.suggestion)}</div>
    <div class="hist">Project ${esc(f.refs.projectId)} · Rev ${esc(f.refs.revision)}${f.refs.paths.length ? ' · ' + esc(f.refs.paths.slice(0, 6).join(', ')) + (f.refs.paths.length > 6 ? ' …' : '') : ''}${f.history.length ? '<br>' + f.history.map(h => `${esc(h.at.slice(0, 16).replace('T', ' '))} – ${esc(h.by)} ${esc(h.action)}${h.note ? ': “' + esc(h.note) + '”' : ''}`).join('<br>') : ''}</div></div>`;
  const groups = Object.keys(SEV_ORDER).map(k => { const fs = au.findings.filter(f => f.severity === k); return fs.length ? `<h3>${SEV_LABEL[k]} (${fs.length})</h3>${fs.map(finding).join('')}` : ''; }).join('');
  const resolved = Object.entries(S.audit.acks).filter(([id]) => !au.findings.some(f => f.id === id));
  const scopeCount = (lv, types) => S.elements.filter(e => e.level === lv && types.includes(e.type)).length;
  return `<div class="stack">
  <div class="sevcards">${cards}</div>
  <div class="g-2">
    <div class="card"><h2>Approval</h2>
      ${appr ? `<div class="note ${stale ? '' : 'info'}">${stale ? '▲ ' : '✓ '}Approved ${esc(appr.at.slice(0, 16).replace('T', ' '))} by <b>${esc(appr.by)}</b> at ${esc(peso(appr.totals.grand))}.${stale ? ` The estimate has changed since (now ${esc(peso(T.grand))}); exports are marked DRAFT until it is approved again.` : ''}</div>` : '<p class="muted" style="margin-top:0">This estimate is a working draft.</p>'}
      <div class="grid" style="margin-top:8px">${field('Your name (recorded with acknowledgements and approvals)', `<input value="${esc(user)}" data-bind="user:name" placeholder="e.g. J. Dela Cruz">`)}</div>
      <div class="row" style="margin-top:10px">
        <button class="btn pri" data-act="approve" ${au.blocking.length || !user ? 'disabled' : ''}>${appr && !stale ? 'Re-approve' : 'Approve estimate'}</button>
        ${appr ? '<button class="btn" data-act="revokeApproval">Revoke approval</button>' : ''}
      </div>
      <p class="${au.blocking.length ? 'err' : 'muted'}" style="font-size:12.5px">${au.blocking.length ? `Blocked: ${au.blocking.length} critical finding(s) must be resolved. Critical findings cannot be acknowledged.` : !user ? 'Enter your name to approve.' : `Ready: no critical findings. ${au.openCounts.major} major and ${au.openCounts.minor} minor open findings will be recorded with the approval.`}</p>
      ${S.audit.approvalLog.length ? `<h3>Approval log</h3><div class="tbl-wrap"><table><tr><th>When</th><th>Who</th><th>Action</th><th class="n">Total</th><th>Note</th></tr>${S.audit.approvalLog.slice().reverse().map(a => `<tr><td>${esc(String(a.at).slice(0, 16).replace('T', ' '))}</td><td>${esc(a.by)}</td><td>${esc(a.action)}</td><td class="n">${a.grand !== undefined ? esc(peso(a.grand)) : ''}</td><td>${esc(a.note || '')}</td></tr>`).join('')}</table></div>` : ''}
    </div>
    <div class="card"><h2>Audit policy</h2><div class="grid" style="grid-template-columns:1fr">
      ${field('Export policy', `<select data-bind="policy:exportPolicy">${EXPORT_POLICIES.map(([k, n]) => `<option value="${k}" ${pol.exportPolicy === k ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`)}
      ${field('Unverified coefficients used by the estimate are', `<select data-bind="policy:unverifiedCoefficients"><option value="critical" ${pol.unverifiedCoefficients === 'critical' ? 'selected' : ''}>Critical – block approval (recommended)</option><option value="major" ${pol.unverifiedCoefficients === 'major' ? 'selected' : ''}>Major – allow approval, record as open</option></select>`)}
      ${field('Price validity', `<input type="number" step="1" min="0" value="${esc(pol.priceValidityDays)}" data-bind="policy:priceValidityDays">`, 'days; 0 = no expiry')}
    </div><p class="muted" style="font-size:12px">Checks are deterministic rules (audit ${AUDIT_VERSION}) on your inputs and the calculation results. No AI is used to judge arithmetic.</p></div>
  </div>
  <div class="card"><h2>Drawing takeoff register</h2><p class="muted" style="margin-top:0">Mark each scope as you finish taking it off the drawings. Incomplete scopes are reported as findings.</p>
    <div class="tbl-wrap"><table><tr><th>Level</th>${TAKEOFF_SCOPES.map(([, n]) => `<th>${esc(n)}</th>`).join('')}</tr>
    ${S.levels.map(l => `<tr><td><b>${esc(l.name)}</b></td>${TAKEOFF_SCOPES.map(([k, , types]) => { const v = (S.takeoff[l.id] || {})[k] || 'pending'; return `<td><select data-bind="takeoff:${esc(l.id)}:${k}" style="min-width:120px">${TAKEOFF_STATUS.map(([sv, sn]) => `<option value="${sv}" ${v === sv ? 'selected' : ''}>${esc(sn)}</option>`).join('')}</select><div class="muted" style="font-size:11px">${scopeCount(l.id, types)} element(s)</div></td>`; }).join('')}</tr>`).join('')}
    </table></div></div>
  <div class="card"><div class="row between"><h2 style="margin:0">Findings (${au.findings.length})</h2><span class="muted" style="font-size:12px">Sorted by severity. IDs stay the same while the cause is unchanged.</span></div>
    ${au.findings.length ? groups : '<p class="muted">No findings.</p>'}
    ${resolved.length ? `<h3>Resolved (${resolved.length})</h3><p class="muted" style="font-size:12px">Previously acknowledged findings that are no longer detected: ${resolved.map(([id]) => esc(id)).join(', ')}</p>` : ''}
  </div>
  <div class="card"><details><summary style="cursor:pointer;font-weight:600">Rule catalogue (${Object.keys(RULES).length} rules)</summary>
    <div class="tbl-wrap" style="margin-top:10px"><table><tr><th>Rule</th><th>Severity</th><th>Checks</th></tr>${Object.entries(RULES).map(([id, [sv, t]]) => `<tr><td class="muted">${id}</td><td><span class="sev ${sv}">${SEV_LABEL[sv]}</span></td><td>${esc(t)}</td></tr>`).join('')}</table></div>
    <p class="muted" style="font-size:12px">Unit plausibility limits: metres ${AUDIT_LIMITS.mMin}–${AUDIT_LIMITS.mMax} (sections ≤ ${AUDIT_LIMITS.sectionMax} m); cover ${AUDIT_LIMITS.coverMin}–${AUDIT_LIMITS.coverMax} mm; plaster ${AUDIT_LIMITS.plasterMin}–${AUDIT_LIMITS.plasterMax} mm; spacing ${AUDIT_LIMITS.spacingMin}–${AUDIT_LIMITS.spacingMax} mm. These are data-entry checks, not design limits.</p></details></div>
  </div>`;
}

// ---- Prices
function vPrices() {
  const src = o => o.source === 'sample' ? '<span class="pill warn">Sample</span>' : o.source === 'unset' ? '<span class="pill bad">Not set</span>' : `<span class="pill good">Yours${o.updatedAt ? ' · ' + esc(o.updatedAt) : ''}</span>`;
  return `<div class="stack">
  <div class="card"><div class="row between"><h2 style="margin:0">Material prices</h2><button class="btn sm" data-act="resetPrices">Reset to sample prices</button></div>
    <div class="note">Sample prices are placeholders, not market data, and newer items have no price (“Not set”). Enter your current supplier prices; edited prices are marked “Yours”. Specified products (tiles, roofing sheets, doors, fixtures…) are priced inside their element.</div>
    <div class="tbl-wrap"><table><tr><th>Code</th><th>Material</th><th>Unit</th><th class="n">Unit price (₱)</th><th>Source</th></tr>
    ${MATERIALS.map(([c]) => { const m = S.prices[c]; return `<tr><td class="muted">${c}</td><td>${inputB(`price:${c}:name`, m.name)}</td><td>${esc(m.unit)}</td>
      <td class="n">${inputB(`price:${c}:price`, m.price, 'number', 'style="max-width:130px;text-align:right"')}</td><td>${src(m)}</td></tr>`; }).join('')}
    </table></div></div>
  <div class="card"><h2>Labor rates</h2>
    <p class="muted" style="margin-top:0">Per unit (₱ per m², kg, m³, set), or as a % of the materials cost of that division.</p>
    <div class="tbl-wrap"><table><tr><th>Division</th><th>Labor item</th><th>Unit</th><th>Basis</th><th class="n">Rate</th><th>Source</th></tr>
    ${LABOR.map(([c, d]) => { const l = S.labor[c]; return `<tr><td><span class="tchip" style="--c:var(--d-${d})">${esc(DIV_NAME[d])}</span></td><td>${inputB(`labor:${c}:name`, l.name)}</td><td>${esc(l.unit)}</td>
      <td><select data-bind="labor:${c}:mode"><option value="unit" ${l.mode === 'unit' ? 'selected' : ''}>₱ per ${esc(l.unit)}</option><option value="pct" ${l.mode === 'pct' ? 'selected' : ''}>% of materials</option></select></td>
      <td class="n">${inputB(`labor:${c}:rate`, l.rate, 'number', 'style="max-width:110px;text-align:right"')}</td><td>${src(l)}</td></tr>`; }).join('')}
    </table></div></div></div>`;
}

// ---- Factors (with provenance)
const FACTOR_LABEL = {
  'rebar.lapFactor': 'Lap splice (× d)', 'rebar.tieHookD': 'Tie hook extension, 135° (× d)', 'rebar.tieHookMin': 'Tie hook minimum (mm)', 'rebar.hook90D': '90° hook extension (× d)',
  'rebar.commercial': 'Commercial lengths (m)', 'rebar.tieWirePerX': 'Tie wire per intersection (m)', 'rebar.tieWireMPerKg': '#16 tie wire length per kg (m/kg)', 'rebar.allowancePct': 'Extra allowance on rebar (%)',
  'chb.perSqm': 'CHB per m²', 'chb.courseH': 'Course height (m)', 'plaster.sandPerCum': 'Sand per m³ plaster mortar (m³)',
};
function factorLabel(p) {
  if (FACTOR_LABEL[p]) return FACTOR_LABEL[p];
  if (MODULE_FACTOR_META[p]) return MODULE_FACTOR_META[p][3];
  let m;
  if ((m = p.match(/^concrete\.(\w+)\.(\w+)$/))) return `Class ${m[1]} – ${m[2]} ${m[2] === 'cement' ? '(bags/m³)' : '(m³/m³)'}`;
  if ((m = p.match(/^chb\.mortar\.(\d)\.(\w+)$/))) return `${m[1]}" CHB mortar – ${m[2] === 'sand' ? 'sand (m³/m²)' : 'class ' + m[2] + ' cement (bags/m²)'}`;
  if ((m = p.match(/^plaster\.(\w)$/))) return `Plaster class ${m[1]} – cement (bags/m³)`;
  if ((m = p.match(/^boards\.(\w+)\.(\w)$/))) return `${m[1]} board ${m[2] === 'w' ? 'width' : 'length'} (m)`;
  if ((m = p.match(/^waste\.(\w+)$/))) return `Waste – ${m[1]} (%)`;
  return p.split('.').slice(1).join(' ').replace(/([A-Z])/g, ' $1').toLowerCase();
}
function vFactors() {
  const groups = [['rebar', 'Rebar'], ['concrete', 'Concrete mix per m³ (40 kg bags)'], ['chb', 'CHB and laying mortar per m² of wall'], ['plaster', 'Plaster mortar'], ['boards', 'Board sizes'], ['ceiling', 'Ceiling'], ['partition', 'Partition'], ['waste', 'Waste allowances'],
    ['earth', 'Earthworks'], ['roof', 'Roofing'], ['tile', 'Tiles'], ['waterproof', 'Waterproofing'], ['paint', 'Painting'], ['steel', 'Structural steel']];
  const all = factorPaths(S.factors), fm = S.factorMeta, nv = Object.values(fm).filter(m => m.verified).length;
  return `<div class="stack">
  <div class="card"><div class="row between"><h2 style="margin:0">Estimating factors</h2><button class="btn sm" data-act="resetFactors">Reset to defaults</button></div>
    <p class="muted">These factors are saved with this project; changing one updates every element. <b>${nv} of ${all.length}</b> are verified.</p>
    <div class="note">Concrete, mortar and plaster factors are designated as <b>${esc(SRC_FAJARDO)}</b>. The values have not been checked against the book. Enter the table and page you checked, then tick <b>Verified</b>. The 5" CHB mortar row is interpolated and has no cited source. Coefficients of the newer calculators start <b>Not set</b>: items that need them are left out of the BOQ until you enter a value.</div></div>
  ${groups.map(([g, title]) => `<div class="card"><h2>${esc(title)}</h2><div class="tbl-wrap"><table>
    <tr><th>Factor</th><th class="n">Value</th><th>Source</th><th>Table / page checked</th><th>Verified</th></tr>
    ${all.filter(([p]) => p.split('.')[0] === g).map(([p, v]) => { const m = fm[p] || {source: '', ref: '', verified: false, note: ''}; return `<tr>
      <td>${esc(factorLabel(p))}</td>
      <td class="n">${Array.isArray(v) ? inputB(`factor:${p}:value`, v.join(', '), 'text', 'style="max-width:160px"') : inputB(`factor:${p}:value`, v, 'number', 'style="max-width:110px;text-align:right"')}</td>
      <td style="max-width:320px">${esc(m.source)}${m.note ? `<div class="muted" style="font-size:11.5px">${esc(m.note)}</div>` : ''}</td>
      <td>${inputB(`factor:${p}:ref`, m.ref, 'text', 'placeholder="e.g. Table 2-3, p. 41"')}</td>
      <td><label class="chk"><input type="checkbox" data-bind="factor:${esc(p)}:verified" ${m.verified ? 'checked' : ''} ${v === null ? 'disabled' : ''}> <span class="pill ${v === null ? 'bad' : m.verified ? 'good' : /interpolated/i.test(m.source) ? 'bad' : 'warn'}">${v === null ? 'Not set' : m.verified ? 'Verified' : /interpolated/i.test(m.source) ? 'Interpolated' : 'Unverified'}</span></label></td></tr>`; }).join('')}
  </table></div></div>`).join('')}
  </div>`;
}

function vSelfTest() {
  const res = [...runSelfTests(), ...runModuleSelfTests()], ok = res.filter(r => r.ok).length;
  return `<div class="card" id="selftest"><h2>Self-test: <span class="${ok === res.length ? 'pass' : 'fail'}" id="selftest-summary">${ok}/${res.length} passed</span></h2>
    <p class="muted">Worked examples calculated by hand and checked against the engine (engine ${esc(ENGINE_VERSION)}, modules ${esc(MODULES_VERSION)}). Coefficients in the module examples are test inputs, not defaults.</p>
    <table>${res.map(r => `<tr><td class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</td><td>${esc(r.name)}${r.fails.map(f => `<div class="err">${esc(f)}</div>`).join('')}</td></tr>`).join('')}</table></div>`;
}

render();
</script>
</body>
</html>
